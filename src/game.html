<title>倒倒乐</title>
<style>
:root{
  --bg0:#0d1828;--bg1:#18324a;--ink:#f4f1e8;--ink2:#a9b8c9;--line:rgba(255,255,255,.14);
  --panel:#16263a;--panel2:#1d3149;--gold:#f6c85a;--gold-hi:#ffe08a;--accent:#38c6b8;--red:#f06a5a;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg0:#0d1828;--bg1:#18324a;--ink:#f4f1e8;--panel:#16263a}}
:root[data-theme="dark"]{--bg0:#0d1828;--bg1:#18324a;--ink:#f4f1e8;--panel:#16263a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 18%,var(--bg1) 0%,var(--bg0) 70%);user-select:none;-webkit-user-select:none}
#hud{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 4px;padding-top:max(10px,env(safe-area-inset-top))}
#hud .icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center}
#hud .icon svg{width:20px;height:20px}
.lvl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.lvl b{font-size:19px;letter-spacing:.5px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--ink2)}
.chip.challenge{background:rgba(240,106,90,.18);color:#ffb3a8}
.chip.casual{background:rgba(56,198,184,.18);color:#9ff0e6}
.stats{display:flex;gap:10px;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px}
.stats b{color:var(--ink);font-weight:600}
#clock.pen{color:var(--red);transition:none}
#stage{flex:1;position:relative;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#tip{position:absolute;left:16px;right:16px;bottom:8px;text-align:center;font-size:15px;color:var(--ink);
  pointer-events:none;transition:opacity .3s,transform .3s}
#tip span{display:inline-block;padding:7px 14px;border-radius:99px;background:rgba(10,20,34,.72);border:1px solid var(--line)}
#tip.hide{opacity:0;transform:translateY(6px)}
#hand{position:absolute;left:0;top:0;width:38px;height:46px;pointer-events:none;z-index:3;
  transition:transform .45s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
#hand svg{width:100%;height:100%;animation:tap 1s ease-in-out infinite;transform-origin:30% 10%}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(6px) scale(.92)}}
#tools{flex:none;display:flex;justify-content:center;gap:10px;padding:6px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.tool{position:relative;width:68px;height:58px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink2)}
.tool svg{width:24px;height:24px;color:var(--ink)}
.tool:active{transform:scale(.95)}
.tool[disabled]{opacity:.4}
.tool i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--gold);color:#3a2a06;
  font:700 12px/20px system-ui;font-style:normal;text-align:center}
.tool i.pen{background:var(--red);color:#fff;font-size:10px}
.tool i:empty{display:none}
.tool.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(246,200,90,.35);border-color:var(--gold)}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;
  padding:8px 16px;border-radius:99px;background:rgba(10,20,34,.9);border:1px solid var(--line);font-size:14px;white-space:nowrap;
  transition:opacity .25s,transform .25s;pointer-events:none}
#toast.hide{opacity:0;transform:translate(-50%,-8px)}
#rescue{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;margin:0 auto;max-width:420px;
  padding:14px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45);
  animation:up .25s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
#rescue b{display:block;font-size:16px;margin:0 2px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:13px;background:rgba(255,255,255,.09);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,#ffd978,#f0b440);color:#3a2706;border:0;box-shadow:0 3px 0 #b07a1c}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #b07a1c}
.btn.ghost{background:none}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,12,22,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#home{background:radial-gradient(120% 80% at 50% 0%,#1d3a57 0%,#0c1626 75%);align-items:stretch}
.panel{width:100%;max-width:420px;border-radius:24px;background:var(--panel);border:1px solid var(--line);padding:22px 18px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.home{display:flex;flex-direction:column;gap:14px;background:none;border:0;box-shadow:none;padding:max(14px,env(safe-area-inset-top)) 2px 10px;margin:0 auto;animation:none;min-height:0}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:6px}
.brand svg{width:64px;height:64px}
.brand h1{margin:0;font-size:34px;letter-spacing:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:12px 12px;text-align:left;background:rgba(255,255,255,.05);border:1.5px solid var(--line)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--ink2);font-size:12px}
.mode.on{border-color:var(--accent);background:rgba(56,198,184,.12)}
.mode[data-mode=challenge].on{border-color:var(--red);background:rgba(240,106,90,.12)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:2px 2px 8px;align-content:start}
.cell{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:700;font-size:17px}
.cell small{font-size:10px;letter-spacing:1px;color:var(--gold);height:12px;line-height:12px}
.cell.cur{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cell[disabled]{opacity:.32}
.opts{display:flex;gap:16px;justify-content:center;color:var(--ink2);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
.ver{text-align:center;color:var(--ink2);font-size:11px;opacity:.6;margin:0}
.win{text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:-4px 0 6px}
.stars svg{width:46px;height:46px;opacity:.18;transform:scale(.6);transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.stars svg.on{opacity:1;transform:scale(1)}
.stars svg:nth-child(2){margin-top:-10px;width:56px;height:56px}
.win h2{margin:0 0 6px;font-size:26px}
.win p{margin:0 0 16px;color:var(--ink2)}
.win p b{color:var(--ink)}
@media (max-height:640px){.brand svg{width:48px;height:48px}.brand h1{font-size:28px}.tool{height:52px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
<div id="app">
  <header id="hud">
    <button id="homeBtn" class="icon" aria-label="关卡"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="lvl"><b id="lvlNum">第 1 关</b><span id="modeChip" class="chip">爽玩</span></div>
    <div class="stats"><span id="clock">0:00</span><span><b id="moves">0</b> 步</span></div>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="tip" class="hide"><span></span></div><div id="hand" hidden></div></div>
  <nav id="tools">
    <button class="tool" data-tool="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>撤销<i></i></button>
    <button class="tool" data-tool="restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>重来<i></i></button>
    <button class="tool" data-tool="tube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v13a4 4 0 0 0 8 0V3"/><path d="M6.5 3h11"/><path d="M12 8v6M9 11h6"/></svg>加瓶<i></i></button>
    <button class="tool" data-tool="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>提示<i></i></button>
  </nav>
  <div id="toast" class="hide"></div>
  <div id="rescue" hidden><b id="rsTitle">这条路走不通了</b><div class="row">
    <button class="btn primary" id="rsBack">退回</button><button class="btn" id="rsTube">加个空瓶</button><button class="btn ghost" id="rsClose">再想想</button></div></div>
  <div id="win" class="overlay" hidden><div class="panel win">
    <div class="stars" id="winStars"></div><h2 id="winTitle">漂亮</h2><p id="winInfo"></p>
    <div class="row"><button class="btn ghost" id="winHome">关卡</button><button class="btn" id="winAgain">再玩一次</button><button class="btn primary" id="winNext">下一关</button></div>
  </div></div>
  <div id="home" class="overlay"><div class="panel home">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true">
      <g transform="rotate(-14 20 40)"><path d="M12 10v34a8 8 0 0 0 16 0V10" fill="rgba(255,255,255,.08)" stroke="#e8f2ff" stroke-width="2.4"/>
        <path d="M14 34h12v10a6 6 0 0 1-12 0z" fill="#e8463a"/><path d="M14 24h12v10H14z" fill="#f6d33c"/></g>
      <g transform="rotate(10 44 40)"><path d="M36 14v30a8 8 0 0 0 16 0V14" fill="rgba(255,255,255,.08)" stroke="#e8f2ff" stroke-width="2.4"/>
        <path d="M38 30h12v14a6 6 0 0 1-12 0z" fill="#3d7bf0"/><path d="M38 22h12v8H38z" fill="#33c4c0"/></g></svg><h1>倒倒乐</h1></div>
    <div class="modes"><button class="mode" data-mode="casual"><b>爽玩</b><small>点哪倒哪 · 不计时</small></button>
      <button class="mode" data-mode="challenge"><b>挑战</b><small>计时 · 道具有限</small></button></div>
    <button class="btn primary" id="playBtn" style="flex:none;height:52px;font-size:17px">开始</button>
    <div class="grid" id="grid"></div>
    <div class="opts"><label><input type="checkbox" id="optSound">声音</label><label><input type="checkbox" id="optSym">颜色加图案</label></div>
    <p class="ver">v1.0 · 每关都保证有解</p>
  </div></div>
</div>
<script>
/*ENGINE-START*/
// ===== 规则引擎：纯函数，游戏和离线脚本共用同一份 =====
// 局面 s={cap, t:[[颜色,...],...]}，每个瓶子从底到顶
const CAP=4;
function rngOf(a){a=a>>>0;return function(){a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffleIn(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const topOf=t=>t.length?t[t.length-1]:-1;
function runOf(t){const c=topOf(t);let n=0;for(let i=t.length-1;i>=0&&t[i]===c;i--)n++;return n;}
const isDone=(t,cap)=>t.length===cap&&runOf(t)===cap;
const isMono=t=>t.length>0&&runOf(t)===t.length;
const cpS=s=>({cap:s.cap,t:s.t.map(x=>x.slice())});
// 能倒：源瓶有水且没装满单色，目标瓶没满，目标是空瓶或顶上同色
function canPour(s,i,j){const a=s.t[i],b=s.t[j];return i!==j&&a.length>0&&b.length<s.cap&&!isDone(a,s.cap)&&(!b.length||topOf(b)===topOf(a));}
// 顶上连着的同色一起倒，倒不下的留在原瓶
const pourAmt=(s,i,j)=>Math.min(runOf(s.t[i]),s.cap-s.t[j].length);
function applyPour(s,i,j){const n=pourAmt(s,i,j),r=cpS(s),c=topOf(r.t[i]);for(let k=0;k<n;k++){r.t[i].pop();r.t[j].push(c);}return r;}
const isSolved=s=>s.t.every(x=>!x.length||isDone(x,s.cap));
function legalMoves(s){const m=[];for(let i=0;i<s.t.length;i++)for(let j=0;j<s.t.length;j++)if(canPour(s,i,j))m.push([i,j]);return m;}
// 求解用的步：整瓶单色倒进空瓶等于没走，多个空瓶只算第一个；去掉这些不会丢解
function usefulMoves(s){
  const m=[];let e0=-1;s.t.forEach((x,k)=>{if(!x.length&&e0<0)e0=k;});
  for(let i=0;i<s.t.length;i++)for(let j=0;j<s.t.length;j++){
    if(!canPour(s,i,j))continue;
    if(!s.t[j].length&&(j!==e0||isMono(s.t[i])))continue;
    m.push([i,j]);
  }
  return m;
}
// 只剩单色瓶时，剩下的只是把同色并到一起，游戏会自动收尾
function onlyMerges(s){return s.t.every(x=>!x.length||isMono(x));}
const keyOf=s=>s.t.map(x=>String.fromCharCode(...x.map(c=>97+c))).sort().join('|');
// 估价：瓶内换色次数 + 每种颜色分散在几个瓶子
function heur(s){
  let h=0;const n=new Map();
  for(const x of s.t){for(let k=1;k<x.length;k++)if(x[k]!==x[k-1])h++;for(const c of new Set(x))n.set(c,(n.get(c)||0)+1);}
  for(const v of n.values())h+=v-1;
  return h;
}
// 加权 A*：w 越大越快、解越长。返回 {ok,path}；ok=false 且 capped=false 表示确定无解
function solve(s0,maxNodes=60000,w=2){
  if(isSolved(s0))return{ok:true,path:[]};
  const H=[];
  const push=n=>{H.push(n);let i=H.length-1;while(i){const p=i-1>>1;if(H[p].f<=n.f)break;H[i]=H[p];i=p;}H[i]=n;};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){let i=0;for(;;){const l=2*i+1,r=l+1;let m=-1,f=last.f;
    if(l<H.length&&H[l].f<f){m=l;f=H[l].f;}if(r<H.length&&H[r].f<f)m=r;if(m<0)break;H[i]=H[m];i=m;}H[i]=last;}return top;};
  const seen=new Map([[keyOf(s0),0]]);let nodes=0,ord=0;
  push({s:s0,g:0,f:w*heur(s0),mv:null,par:null});
  while(H.length){
    const n=pop();if(++nodes>maxNodes)return{ok:false,capped:true,nodes};
    for(const [i,j] of usefulMoves(n.s)){
      const s=applyPour(n.s,i,j),k=keyOf(s),g=n.g+1;
      if(seen.has(k)&&seen.get(k)<=g)continue;seen.set(k,g);
      const c={s,g,f:g+w*heur(s)-(++ord)*1e-9,mv:[i,j],par:n};
      if(isSolved(s)){const path=[];for(let x=c;x.mv;x=x.par)path.push(x.mv);return{ok:true,path:path.reverse(),nodes};}
      push(c);
    }
  }
  return{ok:false,capped:false,nodes};
}

// ===== 关卡参数：第 1 关教学，第 2 关巩固，第 3 关开始有挑战；之后「紧—松—中」循环，颜色逐渐变多 =====
// pick 是离线选关时在一批候选里取第几百分位的难度（1 最难，0 最容易）；adj 是开局同瓶相邻同色的上限
function baseParams(L){
  if(L===1)return{fixed:[[0,0,6,6],[6,6,0,0],[]],colors:2,empty:1,pick:.5};
  if(L===2)return{colors:4,empty:2,adj:5,pick:.1};
  if(L===3)return{colors:6,empty:2,adj:2,pick:.85};
  if(L===4)return{colors:6,empty:2,adj:3,pick:.4};
  if(L===5)return{colors:7,empty:2,adj:2,pick:.8};
  if(L===6)return{colors:7,empty:2,adj:3,pick:.2};
  if(L===7)return{colors:8,empty:2,adj:2,pick:.8};
  const colors=Math.min(12,8+Math.floor((L-8)/6)),hidden=L===8||(L>8&&L%4===0),k=L%3;
  if(k===2)return{colors,empty:2,adj:1,hidden,pick:hidden?.5:.85};
  if(k===0)return{colors:colors-1,empty:2,adj:3,hidden,pick:.15};
  return{colors,empty:2,adj:2,hidden,pick:hidden?.3:.5};
}
// 爽玩：颜色少、颜色多时多给一个空瓶、没有问号，只挑最顺的局
function levelParams(L,mode){
  const P=baseParams(L);if(mode!=='casual'||P.fixed)return P;
  const colors=Math.min(10,Math.max(3,P.colors-(L<=4?1:2)));
  return{...P,colors,empty:colors>=8?3:2,adj:P.adj+2,hidden:false,pick:.05};
}
function generateSeed(L,seed,mode='challenge'){
  const P=levelParams(L,mode);
  if(P.fixed)return{s:{cap:CAP,t:P.fixed.map(x=>x.slice())},P,seed};
  const rng=rngOf(seed*7919+L*104729+(mode==='casual'?17:0));
  const cols=shuffleIn([...Array(12).keys()],rng).slice(0,P.colors);
  for(let a=0;a<400;a++){
    const u=[];for(const c of cols)for(let k=0;k<CAP;k++)u.push(c);shuffleIn(u,rng);
    const t=[];for(let i=0;i<P.colors;i++)t.push(u.slice(i*CAP,i*CAP+CAP));for(let e=0;e<P.empty;e++)t.push([]);
    let adj=0,bad=false;
    for(const x of t){if(x.length&&runOf(x)>=3)bad=true;for(let k=1;k<x.length;k++)if(x[k]===x[k-1])adj++;}
    if(!bad&&adj<=P.adj)return{s:{cap:CAP,t},P,seed};
  }
  return null;
}
// 模拟一个会撤销的普通玩家：偏爱倒在同色上、不走回头路，走进死路就退一步。统计每局要退多少次（取中位数）
function deadStats(s0,n=12,seed=1){
  const rng=rngOf(seed*31+7),ds=[];let zero=0;
  for(let p=0;p<n;p++){
    const vis=new Set([keyOf(s0)]),st=[{s:s0,opts:null}];let dead=0,nodes=0;
    while(st.length){
      const top=st[st.length-1];
      if(onlyMerges(top.s))break;
      if(!top.opts)top.opts=usefulMoves(top.s).map(([i,j])=>{const t=applyPour(top.s,i,j),b=top.s.t[j];
        let w=b.length?4:1;if(b.length&&isMono(b))w+=2;if(isDone(t.t[j],t.cap))w+=6;return{t,w,k:keyOf(t)};});
      const av=top.opts.filter(o=>!vis.has(o.k));
      if(!av.length){st.pop();dead++;continue;}
      let r=rng()*av.reduce((a,o)=>a+o.w,0),o=av[0];for(const x of av){r-=x.w;if(r<=0){o=x;break;}}
      vis.add(o.k);st.push({s:o.t,opts:null});
      if(++nodes>4000){dead=999;break;}
    }
    ds.push(dead);if(!dead)zero++;
  }
  ds.sort((a,b)=>a-b);
  return{dead:ds[n>>1],zero:zero/n};
}
function scoreLevel(g,n=12){
  const r=solve(g.s,80000,1.5);if(!r.ok)return null;
  return{...deadStats(g.s,n,g.seed),par:r.path.length};
}
/*SEEDS-START*/const LEVEL_SEEDS=[];/*SEEDS-END*/
/*CASUAL-SEEDS-START*/const CASUAL_SEEDS=[];/*CASUAL-SEEDS-END*/
// 表里存 [种子, 标准步数]；超出表的关卡现场挑一个有解的
function generate(L,mode='challenge'){
  const tab=mode==='casual'?CASUAL_SEEDS:LEVEL_SEEDS,e=tab[L-1];
  if(e){const g=generateSeed(L,e[0],mode);if(g)return{...g,par:e[1]};}
  for(let seed=1;seed<60;seed++){
    const g=generateSeed(L,seed,mode);if(!g)continue;
    const r=solve(g.s,40000,2);if(r.ok)return{...g,par:r.path.length};

}

<script>

// ===== 瓶子几何：本地坐标 u 向右、v 向上，原点在瓶底中心。液体按面积计算，倾斜时液面保持水平 =====
const GEO={w:0};

}

const LC=new Map();
// 倾斜 th 时装 A 面积的液体，液面所在的世界高度
function levelC(th,A){
  const key=Math.round(th*2000)+'|'+Math.round(A*4);
  let v=LC.get(key);if(v!==undefined)return v;
  const P=GEO.P,sn=Math.sin(th),cs=Math.cos(th);let lo=Infinity,hi=-Infinity;
  for(const p of P){const h=-p[0]*sn+p[1]*cs;if(h<lo)lo=h;if(h>hi)hi=h;}

    for(let k=0;k<22;k++){const m=(lo+hi)/2;if(areaOf(clipPoly(P,sn,cs,m))<A)lo=m;else hi=m;}

  }
  if(LC.size>6000)LC.clear();LC.set(key,v);return v;
}
function buildGeo(w){
  const H=w*3.45,r=w*.47,P=[[-w/2,H]];
  for(let k=0;k<=10;k++){const a=Math.PI+k/10*Math.PI/2;P.push([-w/2+r+Math.cos(a)*r,r+Math.sin(a)*r]);}

  GEO.tab=[];

}

// ===== 存档（只存在本机浏览器）。两个模式分开记进度；挑战模式按关保存最佳用时，留给以后的排行榜 =====

// ===== 布局 =====
function layout(animate){

function drawTube(T,ox,oy,th,t){
  const g=GEO,w=g.w,H=g.H;

  ctx.restore();
  tubePath();ctx.strokeStyle='rgba(225,238,255,.62)';ctx.lineWidth=Math.max(1.6,w*.055);ctx.lineJoin='round';ctx.stroke();
  ctx.fillStyle='rgba(225,238,255,.7)';ctx.beginPath();ctx.ellipse?ctx.ellipse(0,H,w/2+w*.08,w*.07,0,0,7):ctx.rect(-w/2-w*.08,H-2,w+w*.16,4);ctx.fill();

  ctx.restore();
}
function poseOf(T,t){

  if(G.hint&&t<G.hint.until){const T=TUBES[G.hint.j];if(T)drawChevron(T.x,T.y-H-16+Math.sin(t/170)*3,'#ffe08a');}
  const front=[];
  TUBES.forEach((T,i)=>{if(T.pose||T.drag)front.push(T);else{const p=poseOf(T,t);drawTube(T,p.ox,p.oy,p.th,t);}});
  for(const a of G.anims)if(a.stream)drawStream(a,t);
  for(const T of front){const p=poseOf(T,t);drawTube(T,p.ox,p.oy,p.th,t);}
  drawFx(t);
}
function drawStream(a,t){
  const s=a.stream,w=GEO.w,B=TUBES[a.j],surf=B.y-levelC(0,volOf(B)*GEO.unitA)+2;
  const y0=s.y0,y1=Math.max(y0,Math.min(surf,y0+(surf-y0)*s.head)),yTop=y0+(surf-y0)*s.tail;
  if(y1-yTop<1)return;
  const wid=w*.17*(s.tail>0?1-s.tail*.5:1);
  ctx.save();ctx.fillStyle=PAL[a.c];
  ctx.beginPath();ctx.moveTo(s.x0-wid/2,yTop);ctx.quadraticCurveTo(B.x-wid/2,yTop+(y1-yTop)*.3,B.x-wid/2,y1);
  ctx.lineTo(B.x+wid/2,y1);ctx.quadraticCurveTo(B.x+wid/2,yTop+(y1-yTop)*.3,s.x0+wid/2,yTop);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(B.x-wid*.15,yTop+(y1-yTop)*.35,wid*.22,(y1-yTop)*.6);
  ctx.restore();
}

// ===== 粒子与飘字（同一块画布） =====
const FX=[];
function burst(x,y,col,n,sp=1){n=reduceMotion?Math.ceil(n/4):n;
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.6,v=(.12+Math.random()*.32)*sp;
    FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.0009,life:0,max:600+Math.random()*500,s:2+Math.random()*3.5,c:Math.random()<.3?'#fff':col,star:Math.random()<.35,r:Math.random()*6});}
  kick();}
function floatText(x,y,text,col){FX.push({x,y,vx:0,vy:-.05,g:0,life:0,max:1100,text,c:col});kick();}
function confetti(){const n=reduceMotion?30:150;
  for(let i=0;i<n;i++)FX.push({x:Math.random()*R.W,y:-20-Math.random()*R.H*.5,vx:(Math.random()-.5)*.08,vy:.08+Math.random()*.14,g:.00006,life:0,
    max:3000+Math.random()*1200,s:4+Math.random()*5,c:PAL[i%PAL.length],r:Math.random()*6,flut:Math.random()*6});kick();}
let fxLast=0;
function drawFx(t){
  const dt=Math.min(40,t-(fxLast||t));fxLast=t;
  for(let i=FX.length-1;i>=0;i--){const p=FX[i];p.life+=dt;if(p.life>=p.max){FX.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt+(p.flut?Math.sin(p.life/300+p.flut)*.3:0);p.y+=p.vy*dt;p.r+=.01*dt;
    const k=1-p.life/p.max;ctx.globalAlpha=Math.min(1,k*1.8);ctx.fillStyle=p.c;
    if(p.text){ctx.save();const sc=1+Math.max(0,.3-p.life/600);ctx.translate(p.x,p.y);ctx.scale(sc,sc);ctx.font='800 22px system-ui';ctx.textAlign='center';
      ctx.lineWidth=4;ctx.strokeStyle='rgba(10,20,34,.8)';ctx.strokeText(p.text,0,0);ctx.fillText(p.text,0,0);ctx.restore();continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    if(p.star){const s=p.s*1.3;ctx.beginPath();for(let j=0;j<8;j++){const rr=j%2?s*.35:s,a=j*Math.PI/4;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
    else ctx.fillRect(-p.s/2,-p.s*.35,p.s,p.s*.7);
    ctx.restore();}
  ctx.globalAlpha=1;
}

// ===== 主循环：有动画时才跑 =====
function kick(ms=0){R.until=Math.max(R.until,now()+ms);if(!R.raf)R.raf=requestAnimationFrame(frame);}
function frame(t){
  R.raf=0;const dt=Math.min(40,t-(R.last||t));R.last=t;let active=false;
  for(const a of G.anims.slice())a.update(t);
  G.anims=G.anims.filter(a=>!a.done);if(G.anims.length)active=true;
  TUBES.forEach((T,i)=>{
    const lt=G.sel===i&&!T.drag?LIFT:0;T.lift+=(lt-T.lift)*Math.min(1,dt*.02);if(Math.abs(lt-T.lift)>.3)active=true;else T.lift=lt;
    const k=Math.min(1,dt*.012);T.x+=(T.hx-T.x)*k;T.y+=(T.hy-T.y)*k;if(Math.abs(T.hx-T.x)+Math.abs(T.hy-T.y)>.5)active=true;else{T.x=T.hx;T.y=T.hy;}
    if(T.drag)active=true;
  });
  draw(t);
  if(FX.length||t<R.until||G.sel>=0||(G.hint&&t<G.hint.until))active=true;
  if(active)R.raf=requestAnimationFrame(frame);
}

// ===== 倒水动画：先把逻辑局面改好，画面再慢慢跟上；参与的两个瓶子在动画期间不能再操作 =====
function pourDir(A,B){
  const w=GEO.w,H=GEO.H;let s=A.x<=B.x?1:-1;
  if(s>0&&B.x-H*.95<4)s=-1;else if(s<0&&B.x+H*.95>R.W-4)s=1;
  return s;
}
function originFor(P,th,s){const w=GEO.w,H=GEO.H,sx=s*w/2,c=Math.cos(th),n=Math.sin(th);return{ox:P.x-(sx*c+H*n),oy:P.y-(sx*n-H*c)};}
function startPour(i,j,opt={}){
  const t=now(),s0=G.s,n=pourAmt(s0,i,j),c=topOf(s0.t[i]);
  pushHist();
  G.s=applyPour(s0,i,j);
  for(let k=0;k<n;k++){G.hid[i].pop();G.hid[j].push(false);}
  // 源瓶新露出的一截如果是问号，翻开
  const ti=G.s.t[i];let revealed=false;
  if(ti.length){const run=runOf(ti);for(let k=ti.length-run;k<ti.length;k++)if(G.hid[i][k]){G.hid[i][k]=false;revealed=true;}}
  G.moves++;G.sel=-1;G.hint=null;hand(null);hideRescue();
  if(!opt.auto){timerStart();if(G.script&&G.step<G.script.length)G.step++;}
  hud();
  const A=TUBES[i],B=TUBES[j],sp=opt.speed||1;
  A.busy++;B.busy++;
  const start=poseOf(A,t);A.drag=null;A.pose={...start};
  const top=A.segs[A.segs.length-1];
  let bt=B.segs[B.segs.length-1];if(!bt||bt.c!==c||bt.hid){bt={c,v:0,hid:false,rev:0};B.segs.push(bt);}
  const dir=pourDir(A,B),P={x:B.x,y:B.y-GEO.H-GEO.w*.45-4};
  const A0=volOf(A)*GEO.unitA,th0=dir*Math.max(0,pourAngle(A0)-.05);
  const dMove=260/sp,dFlow=Math.max(300,n*210)/sp,dBack=250/sp;
  const fill0=volOf(B)/CAP,fill1=(volOf(B)+n)/CAP;
  const a={i,j,c,n,t0:t,done:false,stream:null,flowed:false,
    update(t){
      const e=t-this.t0;
      if(e<dMove){const p=easeIO(e/dMove),o=originFor(P,th0,dir);
        A.pose={ox:start.ox+(o.ox-start.ox)*p,oy:start.oy+(o.oy-start.oy)*p,th:start.th+(th0-start.th)*p};return;}
      if(e<dMove+dFlow){
        const q=(e-dMove)/dFlow;
        if(!this.stream){this.stream={x0:P.x,y0:P.y,head:0,tail:0};sfx.pour(fill0,fill1,dFlow/1000);}
        this.stream.head=Math.min(1,(e-dMove)/90);
        const moved=n*q,lag=n*clamp((e-dMove-70)/(dFlow-70),0,1);
        top.v=Math.max(0,top.v0-moved);bt.v=bt.v0+lag;
        const th=dir*pourAngle(A0-moved*GEO.unitA);A.pose={...originFor(P,th,dir),th};
        this.lastTh=th;return;
      }
      if(!this.flowed){this.flowed=true;top.v=top.v0-n;bt.v=bt.v0+n;B.busy--;finishTarget(j,c);}
      const e2=e-dMove-dFlow;
      if(this.stream){this.stream.tail=Math.min(1,e2/110);if(e2>110)this.stream=null;}
      const p=easeIO(Math.min(1,e2/dBack)),o=originFor(P,this.lastTh,dir),hx=A.x,hy=A.y;
      A.pose={ox:o.ox+(hx-o.ox)*p,oy:o.oy+(hy-o.oy)*p,th:this.lastTh*(1-p)};
      if(e2>=dBack){
        this.done=true;A.pose=null;A.lift=0;A.busy--;
        const old=A.segs;A.segs=segsOf(i);
        if(revealed){const tp=A.segs[A.segs.length-1];if(tp)tp.rev=now();sfx.reveal();burst(A.x,A.y-GEO.H*.4,'#fff',10,.6);}
        afterAnims();
      }
    }};
  top.v0=top.v;bt.v0=bt.v;a.lastTh=th0;
  G.anims.push(a);kick();
  if(!opt.auto)sfx.pick();
  checkAuto();
  updateGuide();
}
function finishTarget(j,c){
  const B=TUBES[j];B.segs=segsOf(j);
  if(isDone(G.s.t[j],CAP)&&B.doneT===0){
    const t=now();B.doneT=t;
    G.combo=t-G.lastDone<COMBO_MS?G.combo+1:1;G.lastDone=t;G.maxCombo=Math.max(G.maxCombo,G.combo);
    sfx.done(G.combo);setTimeout(()=>sfx.cork(),260);buzz(18);
    burst(B.x,B.y-GEO.H,PAL[c],22,1);
    if(G.combo>=2)floatText(B.x,B.y-GEO.H-34,`连成 ×${G.combo}`,'#ffe08a');
    kick(1400);
  }
}
function afterAnims(){
  if(G.anims.some(a=>!a.done&&a.update))return;
  if(isSolved(G.s)&&!G.won){G.won=true;setTimeout(winLevel,650);return;}
  if(!G.auto)setTimeout(checkDead,40);
}

// ===== 自动收尾：只剩单色瓶时，把同色并到一起，可以同时倒好几瓶 =====
function checkAuto(){
  if(G.auto||isSolved(G.s)||!onlyMerges(G.s))return;
  G.auto=true;G.sel=-1;
  setTimeout(()=>{toast('自动收尾',1200);autoStep();},280);
}
function autoStep(){
  if(!G.active||!G.auto)return;
  if(isSolved(G.s)){G.auto=false;return;}
  const s=G.s,by=new Map();
  s.t.forEach((x,k)=>{if(x.length&&!isDone(x,CAP)){const c=x[0];if(!by.has(c))by.set(c,[]);by.get(c).push(k);}});
  let issued=false;
  for(const ks of by.values()){
    if(ks.length<2)continue;
    const tgt=ks.reduce((a,b)=>s.t[b].length>s.t[a].length?b:a);
    const src=ks.find(k=>k!==tgt&&!TUBES[k].busy);
    if(src!==undefined&&!TUBES[tgt].busy&&canPour(s,src,tgt)){startPour(src,tgt,{auto:true,speed:1.45});issued=true;break;}
  }
  setTimeout(autoStep,issued?150:90);
}

// ===== 走不通时的救场：撤销到最近一个还能解的局面，或者加一个空瓶 =====
function solvable(s,cap=6000){const r=solve(s,cap,2.5);return r.ok||r.capped;}
function checkDead(){
  if(G.anims.length||G.auto||G.won||isSolved(G.s)||!G.active)return;
  const s=G.s,stuck=!legalMoves(s).some(([i,j])=>!(isMono(s.t[i])&&!s.t[j].length));
  let dead=stuck;
  if(!dead&&casual()){const r=solve(s,6000,3);dead=!r.ok&&!r.capped;}
  if(dead)showRescue(stuck);
}
function backSteps(){for(let k=G.hist.length-1;k>=0;k--)if(solvable(G.hist[k].s))return G.hist.length-k;return G.hist.length;}
function showRescue(stuck){
  const n=backSteps();G.rescue={n};
  $('rsTitle').textContent=stuck?'没有能倒的了':'这条路走不通了';
  $('rsBack').textContent=`退回 ${n} 步`;$('rsBack').hidden=!n;
  $('rsTube').hidden=G.added>=G.tools.tube;
  $('rescue').hidden=false;
}
function hideRescue(){$('rescue').hidden=true;G.rescue=null;}

// ===== 历史与道具 =====
function pushHist(){G.hist.push({s:cpS(G.s),hid:G.hid.map(x=>x.slice()),moves:G.moves});}
function restore(k){
  const h=G.hist[k];G.hist.length=k;G.s=cpS(h.s);G.hid=h.hid.map(x=>x.slice());G.moves=h.moves;
  TUBES.forEach((T,i)=>{T.segs=segsOf(i);T.doneT=isDone(G.s.t[i],CAP)?(T.doneT||-1e9):0;T.shakeT=now()-120;});
  G.sel=-1;G.hint=null;G.auto=false;hud();kick(400);
}
function idle(){return!G.anims.length&&!G.auto&&!G.won&&G.active;}
function spend(tool){
  if(casual())return true;
  if(G.tools[tool]>0){G.tools[tool]--;hud();return true;}
  G.penalty+=PENALTY_MS;drawClock();toast('次数用完了，计时 +20 秒');const c=$('clock');c.classList.add('pen');setTimeout(()=>c.classList.remove('pen'),900);
  return true;
}
function useUndo(n=1){
  if(!idle())return;
  if(!G.hist.length){toast('还没倒过');return;}
  spend('undo');restore(Math.max(0,G.hist.length-n));sfx.undo();hideRescue();updateGuide();
}
function useHint(){
  if(!idle())return;
  let r=solve(G.s,30000,1.5);if(!r.ok&&r.capped)r=solve(G.s,80000,4);
  if(r.ok&&r.path.length){spend('hint');const [i,j]=r.path[0];G.hint={i,j,until:now()+5000};G.sel=-1;sfx.hint();handPath(i,j);kick();return;}
  if(!r.ok&&!r.capped){showRescue(false);return;}
  toast('这一步我也没算出来，先退回几步试试');
}
function useTube(){
  if(!idle())return;
  if(G.added>=G.tools.tube){toast(G.tools.tube===1?'每关只能加一个空瓶':`每关最多加 ${G.tools.tube} 个空瓶`);return;}
  G.added++;G.s.t.push([]);G.hid.push([]);
  for(const h of G.hist){h.s.t.push([]);h.hid.push([]);}
  const T=newTube(G.s.t.length-1);TUBES.push(T);layout(true);T.x=T.hx;T.y=T.hy;T.shakeT=now()-100;
  sfx.tube();hideRescue();hud();burst(T.hx,T.hy-GEO.H*.5,'#ffffff',14,.7);
}
function restart(){if(G.anims.length)return;startLevel(G.L,true);}

// ===== 计时（只在挑战模式显示） =====
let clockH=0;
function timerStart(){if(G.running||G.won)return;G.running=true;G.t0=now();clearInterval(clockH);clockH=setInterval(drawClock,250);}
function timerPause(){if(!G.running)return;G.ms+=now()-G.t0;G.running=false;clearInterval(clockH);drawClock();}
const timeMs=()=>G.ms+(G.running?now()-G.t0:0)+G.penalty;
const fmt=ms=>{const s=Math.floor(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
function drawClock(){$('clock').textContent=fmt(timeMs());}

// ===== 引导：第 1 关手把手，之后几关各提示一句 =====
const GUIDE={
  challenge:[['点一下瓶子，拿起来','再点空瓶，倒进去'],['拿起顶上是红色的瓶子','倒在红色上面']],
  casual:[['点一下瓶子，它会自己找地方倒',''],['再点一下，红色会倒到红色上面','']],
};
const TIPS={
  2:{both:'顶上连着的同色会一起倒；倒不下的留在原瓶'},
  3:{challenge:'卡住了可以撤销，提示会告诉你下一步',casual:'想倒到指定的瓶子，直接拖过去'},
  4:{both:'实在转不开，可以加一个空瓶',pulse:'tube'},
  8:{both:'问号要等上面倒走，才会显出颜色'},
};
let tipH=0;
function tip(text,ms=0){const el=$('tip');clearTimeout(tipH);if(!text){el.classList.add('hide');return;}
  el.firstChild.textContent=text;el.classList.remove('hide');if(ms)tipH=setTimeout(()=>el.classList.add('hide'),ms);}
function updateGuide(){
  if(!G.script||!G.active||!$('home').hidden)return;
  if(G.step>=G.script.length){hand(null);if(G.step===G.script.length){G.step++;tip('只剩单色时，会自动帮你收尾',3200);}return;}
  const [a,b]=G.script[G.step],txt=GUIDE[G.mode][G.step];
  if(!casual()&&G.sel===a){tip(txt[1]);handAt(b);}else{tip(txt[0]);handAt(a);}
}
function mouthOf(i){const T=TUBES[i];return{x:T.hx,y:T.hy-GEO.H*.55};}
let handH=0;
function hand(on){clearInterval(handH);if(!on)$('hand').hidden=true;}
function handAt(i){hand(null);const el=$('hand'),m=mouthOf(i);el.hidden=false;el.style.transform=`translate(${m.x-10}px,${m.y}px)`;}
function handPath(i,j){handAt(i);let k=0;handH=setInterval(()=>{if(!G.hint||now()>G.hint.until){hand(null);return;}
  const m=mouthOf(++k%2?j:i);$('hand').style.transform=`translate(${m.x-10}px,${m.y}px)`;},800);}

// ===== 操作：点选或拖动；爽玩模式点一下自动找最好的地方倒 =====
function pickable(i){const t=G.s.t[i];return t.length>0&&!isDone(t,CAP)&&!TUBES[i].busy;}
function allows(i,j){if(!G.script||G.step>=G.script.length)return true;const [a,b]=G.script[G.step];return i===a&&(j===undefined||j===b);}
function nope(i,why){if(i>=0){TUBES[i].shakeT=now();kick(400);}sfx.nope();if(why&&G.L<=4)toast(why,1400);}
function whyNot(i,j){const a=G.s.t[i],b=G.s.t[j];if(b.length>=CAP)return'这个瓶子满了';if(b.length&&topOf(b)!==topOf(a))return'颜色不一样，倒不进去';return'';}
// 爽玩：挑一个最好的目标瓶。凑满一瓶 > 倒进同色单色瓶 > 整段倒到同色上 > 倒进空瓶 > 只倒进一部分（会把一段拆开）；
// 倒完回到走过的局面排最后，免得两个瓶子来回倒；倒完还能解的优先
function casualTarget(i){
  const s=G.s,a=s.t[i];if(!a.length||isDone(a,CAP))return-1;
  const run=runOf(a),mono=isMono(a),c=[],seen=new Set(G.hist.map(h=>keyOf(h.s)));
  for(let j=0;j<s.t.length;j++){
    if(!canPour(s,i,j)||TUBES[j].busy)continue;const b=s.t[j];let sc;
    if(!b.length){if(mono)continue;sc=400-j*.01;}
    else{const amt=pourAmt(s,i,j),bm=isMono(b);
      if(bm)sc=b.length+amt===CAP?2000:1000+b.length*5;
      else if(mono)sc=amt===run?150:20;
      else sc=amt===run?600+b.length*5:50;}
    if(seen.has(keyOf(applyPour(s,i,j))))sc-=5000;
    c.push({j,sc});
  }
  c.sort((x,y)=>y.sc-x.sc);
  for(const o of c.slice(0,4))if(solvable(applyPour(s,i,o.j),2500))return o.j;
  return c.length?c[0].j:-1;
}
// 点的是没法倒出去的瓶子：找一个能倒进它的
function casualSource(j){
  const s=G.s,b=s.t[j];if(!b.length||b.length>=CAP)return-1;let best=-1,bs=-1e9;const seen=new Set(G.hist.map(h=>keyOf(h.s)));
  for(let k=0;k<s.t.length;k++){if(!canPour(s,k,j)||TUBES[k].busy)continue;const amt=pourAmt(s,k,j);
    const sc=(b.length+amt===CAP&&isMono(b)?1000:0)+(amt===runOf(s.t[k])?100:0)+amt-(seen.has(keyOf(applyPour(s,k,j)))?5000:0);if(sc>bs){bs=sc;best=k;}}
  return best;
}
function tap(i){
  if(i<0){if(G.sel>=0){G.sel=-1;sfx.put();updateGuide();}return;}
  if(casual()){
    if(G.script&&G.step<G.script.length){if(!allows(i)){nope(i);return;}startPour(i,G.script[G.step][1]);return;}
    if(TUBES[i].busy)return;
    const j=casualTarget(i);if(j>=0){startPour(i,j);return;}
    const k=casualSource(i);if(k>=0){startPour(k,i);return;}
    nope(i,G.s.t[i].length?'没有地方能倒':'');return;
  }
  if(G.sel<0){if(pickable(i)&&allows(i)){G.sel=i;sfx.pick();kick();}else nope(i);updateGuide();return;}
  if(G.sel===i){G.sel=-1;sfx.put();updateGuide();return;}
  if(canPour(G.s,G.sel,i)&&!TUBES[i].busy&&allows(G.sel,i)){startPour(G.sel,i);return;}
  if(pickable(i)&&!G.script){G.sel=i;sfx.pick();kick();return;}
  nope(i,whyNot(G.sel,i));
}
function tubeAt(x,y){
  let best=-1,bd=1e9;
  TUBES.forEach((T,i)=>{const dx=Math.abs(x-T.x);if(dx>R.sp/2)return;if(y<T.y-GEO.H-46||y>T.y+18)return;if(dx<bd){bd=dx;best=i;}});
  return best;
}
function dropAt(x,y,src){
  let best=-1,bd=1e9;
  TUBES.forEach((T,i)=>{if(i===src)return;const d=Math.hypot(x-T.x,(y-(T.y-GEO.H*.6))*.6);if(d<bd){bd=d;best=i;}});
  return bd<R.sp*1.1+GEO.H*.25?best:-1;
}
let PT=null;
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  if(!G.active||G.auto||G.won||PT)return;ac();
  const p=pt(e);PT={id:e.pointerId,x0:p.x,y0:p.y,i:tubeAt(p.x,p.y),drag:false,lx:p.x,lt:now()};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!PT||e.pointerId!==PT.id)return;const p=pt(e),t=now();
  if(!PT.drag&&PT.i>=0&&Math.hypot(p.x-PT.x0,p.y-PT.y0)>12&&pickable(PT.i)&&allows(PT.i)){
    const T=TUBES[PT.i],o=poseOf(T,t);PT.drag=true;T.drag={gx:PT.x0-o.ox,gy:PT.y0-o.oy,x:p.x,y:p.y,vx:0};
    if(G.sel!==PT.i){G.sel=PT.i;sfx.pick();}timerStart();
  }
  if(PT.drag){const T=TUBES[PT.i];T.drag.vx=T.drag.vx*.7+((p.x-PT.lx)/Math.max(1,t-PT.lt))*.3*16;T.drag.x=p.x;T.drag.y=p.y;PT.lx=p.x;PT.lt=t;kick();}
});
function endPointer(e,cancel){
  if(!PT||e.pointerId!==PT.id)return;const p=pt(e),P0=PT;PT=null;
  if(P0.drag){
    const T=TUBES[P0.i],j=cancel?-1:dropAt(p.x,p.y,P0.i);
    if(j>=0&&canPour(G.s,P0.i,j)&&!TUBES[j].busy&&allows(P0.i,j)){startPour(P0.i,j);return;}
    const o=poseOf(T,now());T.drag=null;G.sel=-1;returnHome(T,o);
    if(j>=0)nope(-1,whyNot(P0.i,j));updateGuide();return;
  }
  if(!cancel)tap(P0.i);
}
cv.addEventListener('pointerup',e=>endPointer(e,false));
cv.addEventListener('pointercancel',e=>endPointer(e,true));
function returnHome(T,from){
  T.busy++;T.pose={...from};const t0=now();
  G.anims.push({done:false,update(t){const p=easeOut(Math.min(1,(t-t0)/220));T.pose={ox:from.ox+(T.x-from.ox)*p,oy:from.oy+(T.y-from.oy)*p,th:from.th*(1-p)};
    if(p>=1){this.done=true;T.pose=null;T.busy--;}}});kick();
}

// ===== 关卡流程 =====
function startLevel(L,again){
  const g=generate(L,G.mode);if(!g){toast('关卡生成失败');return;}
  Object.assign(G,{L,P:g.P,par:g.par,s:cpS(g.s),hist:[],moves:0,sel:-1,anims:[],auto:false,won:false,active:true,combo:0,maxCombo:0,lastDone:0,
    tools:{...TOOLS[G.mode]},added:0,penalty:0,ms:0,running:false,script:L===1?[[0,2],[1,0]]:null,step:0,hint:null,introT:now()});
  G.hid=G.s.t.map(t=>t.map((_,k)=>!!g.P.hidden&&k<t.length-runOf(t)));
  clearInterval(clockH);
  TUBES=G.s.t.map((_,i)=>newTube(i));
  hideRescue();hand(null);tip(null);layout(false);hud();drawClock();
  $('win').hidden=true;$('home').hidden=true;
  const T=TIPS[L];
  if(G.script)setTimeout(updateGuide,500);
  else if(T){const text=T[G.mode]||T.both;if(text)setTimeout(()=>{if(G.active&&G.L===L&&$('home').hidden)tip(text,5200);},400);
    if(T.pulse){const b=document.querySelector(`[data-tool=${T.pulse}]`);b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');}}
  kick(900);
}
function hud(){
  $('lvlNum').textContent=`第 ${G.L} 关`;
  const chip=$('modeChip');chip.textContent=casual()?'爽玩':'挑战';chip.className='chip '+G.mode;
  $('moves').textContent=G.moves;$('clock').hidden=casual();
  const badge=(k,v)=>{const el=document.querySelector(`[data-tool=${k}] i`);el.className='';
    if(v===Infinity)el.textContent='';else if(v>0)el.textContent=v;else if(k==='tube')el.textContent='0';else{el.textContent='+20s';el.className='pen';}};
  badge('undo',G.tools.undo);badge('hint',G.tools.hint);badge('tube',G.tools.tube-G.added);
}
function starsFor(){const m=G.moves,p=G.par||m;if(casual())return m<=Math.ceil(p*1.5)?3:2;return m<=p?3:m<=Math.ceil(p*1.35)?2:1;}
function winLevel(){
  timerPause();G.active=false;hand(null);tip(null);hideRescue();
  const st=starsFor(),P=prog(),L=G.L,ms=timeMs();
  P.stars[L]=Math.max(P.stars[L]||0,st);P.unlocked=Math.max(P.unlocked,L+1);
  let best='';
  if(!casual()){const r=P.records[L];if(!r||ms<r.ms){P.records[L]={ms,moves:G.moves,at:Date.now()};best=r?'　新纪录！':'';}else best=`　最佳 ${fmt(r.ms)}`;}
  writeSave();sfx.win();confetti();buzz([20,40,30]);
  setTimeout(()=>{
    $('winStars').innerHTML=STAR_SVG.repeat(3);
    [...$('winStars').children].forEach((el,k)=>setTimeout(()=>el.classList.toggle('on',k<st),200+k*180));
    $('winTitle').textContent=st===3?'完美':st===2?'漂亮':'过关';
    const parts=[`<b>${G.moves}</b> 步（标准 ${G.par}）`];
    if(!casual())parts.push(`用时 <b>${fmt(ms)}</b>${best}`);
    if(G.maxCombo>=2)parts.push(`最高连成 ×${G.maxCombo}`);
    $('winInfo').innerHTML=parts.join('<br>');
    $('win').hidden=false;
  },700);
}
function showHome(){
  timerPause();G.active=false;hand(null);
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===G.mode));
  const P=prog(),grid=$('grid');grid.innerHTML='';
  const cur=Math.min(P.unlocked,60);
  for(let L=1;L<=Math.max(60,P.unlocked);L++){
    const b=document.createElement('button');b.className='cell'+(L===cur?' cur':'');b.disabled=L>P.unlocked;
    const s=P.stars[L]||0;b.innerHTML=`${L}<small>${'★'.repeat(s)}</small>`;b.onclick=()=>{ac();startLevel(L);};grid.appendChild(b);
  }
  $('playBtn').textContent=P.unlocked>1?`继续第 ${P.unlocked} 关`:'开始';
  $('optSound').checked=!SAVE.muted;$('optSym').checked=!!SAVE.sym;
  $('win').hidden=true;$('home').hidden=false;
  setTimeout(()=>{const c=grid.querySelector('.cur');c&&c.scrollIntoView({block:'center'});},30);
}
let toastH=0;
function toast(s,ms=2000){const t=$('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(toastH);toastH=setTimeout(()=>t.classList.add('hide'),ms);}

// ===== 按钮 =====
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{ac();
  const k=b.dataset.tool;if(k==='undo')useUndo();else if(k==='hint')useHint();else if(k==='tube')useTube();else restart();}));
$('homeBtn').onclick=showHome;
$('playBtn').onclick=()=>{ac();startLevel(prog().unlocked);};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{G.mode=SAVE.mode=b.dataset.mode;writeSave();showHome();});
$('optSound').onchange=e=>{SAVE.muted=!e.target.checked;SFX.on=!SAVE.muted;writeSave();};
$('optSym').onchange=e=>{SAVE.sym=G.sym=e.target.checked;writeSave();kick(100);};
$('rsBack').onclick=()=>{if(!G.rescue)return;const n=G.rescue.n;useUndo(n);};
$('rsTube').onclick=useTube;
$('rsClose').onclick=hideRescue;
$('winNext').onclick=()=>startLevel(G.L+1);
$('winAgain').onclick=()=>startLevel(G.L,true);
$('winHome').onclick=showHome;
addEventListener('resize',()=>{if(TUBES.length)layout(false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)timerPause();else if(G.active&&G.moves&&!G.won)timerStart();});

loadSave();G.mode=SAVE.mode;SFX.on=!SAVE.muted;G.sym=!!SAVE.sym;
$('hand').innerHTML=HAND_SVG;
// 首页背后先摆一关当背景
startLevel(Math.min(prog().unlocked,60));showHome();
window.__dd={G,GEO,pourAngle,levelC,get TUBES(){return TUBES;},startLevel,tap,useUndo,useHint,useTube,restore,showHome};
})();
</script>
