<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3d2a2">
<meta name="description" content="倒倒乐：倒水排序小游戏，每关都保证有解。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbeedb'/%3E%3Cpath d='M22 10v34a10 10 0 0 0 20 0V10' fill='none' stroke='%239fb2c8' stroke-width='4'/%3E%3Cpath d='M24 34h16v10a8 8 0 0 1-16 0z' fill='%23e8463a'/%3E%3Cpath d='M24 24h16v10H24z' fill='%23f6d33c'/%3E%3C/svg%3E">
</head>
<body>
<title>倒倒乐</title>
<style>
:root{
  --bg0:#fbeedb;--bg1:#fff8ec;--ink:#5b3a29;--ink2:#a5826a;--line:rgba(120,80,50,.14);--soft:rgba(150,100,60,.07);
  --panel:#fffaf2;--panel2:#fff;--gold:#f6b93b;--gold-hi:#cf8518;--accent:#f07391;--pink:#f07391;--red:#ef5466;
  --wood:#d9a065;--wood-hi:#f3d2a2;--wood-lo:#c0834a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg0) 100%);user-select:none;-webkit-user-select:none}
/* 顶部店铺：后墙图片 + 木吧台，订单杯放在吧台上 */
#top{flex:none;position:relative;height:clamp(150px,23vh,210px);
  background:url(shop.jpg) center 62%/cover,linear-gradient(180deg,#f7e6d2,#efd5ba)}
#counter{position:absolute;left:0;right:0;bottom:0;height:24px;z-index:1;
  background:linear-gradient(180deg,var(--wood-hi) 0 7px,var(--wood) 7px,var(--wood-lo));box-shadow:0 6px 12px rgba(120,70,30,.16)}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
  padding:10px 12px 0;padding-top:max(10px,env(safe-area-inset-top))}
#hud .icon{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#ffa9bd,#ef6f8e);border:3px solid #fff;box-shadow:0 3px 0 #d55b79,0 5px 10px rgba(120,40,60,.25)}
#hud .icon svg{width:20px;height:20px}
#hud .icon:active{transform:translateY(2px);box-shadow:0 1px 0 #d55b79}
.lvl{display:flex;flex-direction:column;align-items:center;gap:2px}
.lvl b{font-size:28px;line-height:1.1;font-weight:900;letter-spacing:1px;color:#fff6e6;
  text-shadow:2px 0 #8a3446,-2px 0 #8a3446,0 2px #8a3446,0 -2px #8a3446,1.5px 1.5px #8a3446,-1.5px 1.5px #8a3446,1.5px -1.5px #8a3446,-1.5px -1.5px #8a3446,0 4px 0 #8a3446,0 6px 8px rgba(90,30,40,.3)}
.chip{font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.85);color:var(--ink2)}
.chip.challenge{color:#e0566f}
.chip.casual{color:#2fa58f}
.chip.hard{background:var(--red);color:#fff}
.chip.daily{background:#ffe7b0;color:#b26d0c}
#app.hard{--bg1:#ffe6e1;--bg0:#fbd9d2}
.stats{justify-self:end;display:flex;gap:8px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.82);
  font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px;box-shadow:0 2px 6px rgba(120,70,30,.12)}
.stats b{color:var(--ink);font-weight:700}
#clock{color:var(--ink);font-weight:700}
#clock.pen{color:var(--red);transition:none}
#orders{position:absolute;left:0;right:0;bottom:19px;z-index:2;display:flex;justify-content:center;gap:clamp(18px,8vw,46px);pointer-events:none}
.ord{position:relative;width:46px;height:62px;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.ord.out{transform:translateY(-26px) scale(.5);opacity:0;transition:transform .4s ease-in,opacity .35s ease-in}
.ord.pre{transform:scale(.4);opacity:0;transition:none}
.ord svg{position:absolute;left:0;bottom:0;width:46px;height:62px;overflow:visible}
.ord .fill{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .55s ease-out}
.ord.full .fill{transform:scaleY(1)}
.ord.full{animation:hop .5s .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:translateY(-8px)}}
.bub{position:absolute;left:50%;bottom:58px;width:34px;height:30px;margin-left:-17px;border-radius:12px;background:#fff;
  display:grid;place-items:center;font-size:18px;line-height:1;box-shadow:0 2px 5px rgba(120,70,30,.18);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.swap{transform:scale(1.25)}
.ord.full .bub{background:#e9fbe9}
.ord.full .bub::after{border-top-color:#e9fbe9}
#banner{position:absolute;left:0;right:0;top:30%;z-index:4;text-align:center;pointer-events:none;transition:opacity .4s,transform .4s}
#banner b{display:block;font-size:38px;font-weight:900;letter-spacing:6px;color:#fff6e6;
  text-shadow:2px 0 #c0394f,-2px 0 #c0394f,0 2px #c0394f,0 -2px #c0394f,0 5px 0 #c0394f,0 8px 14px rgba(150,40,60,.35)}
#banner span{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:99px;background:#fff;font-size:14px;color:var(--ink);box-shadow:0 3px 10px rgba(120,70,30,.15)}
#banner.hide{opacity:0;transform:scale(1.15)}
#stage{flex:1;position:relative;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#tip{position:absolute;left:16px;right:16px;bottom:8px;text-align:center;font-size:15px;color:var(--ink);
  pointer-events:none;transition:opacity .3s,transform .3s}
#tip span{display:inline-block;padding:8px 16px;border-radius:99px;background:#fff;box-shadow:0 3px 10px rgba(120,70,30,.15)}
#tip.hide{opacity:0;transform:translateY(6px)}
#hand{position:absolute;left:0;top:0;width:38px;height:46px;pointer-events:none;z-index:3;
  transition:transform .45s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 4px 6px rgba(90,50,20,.35))}
#hand svg{width:100%;height:100%;animation:tap 1s ease-in-out infinite;transform-origin:30% 10%}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(6px) scale(.92)}}
#tools{flex:none;display:flex;justify-content:center;gap:14px;padding:12px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--wood-hi) 0 6px,var(--wood) 6px,var(--wood-lo));box-shadow:0 -4px 12px rgba(120,70,30,.14)}
.tool{position:relative;width:62px;height:54px;border-radius:18px;background:linear-gradient(180deg,#fffaf1,#fbe9d6);border:3px solid #f5a9bb;
  box-shadow:0 4px 0 #dd879d;display:grid;place-items:center;color:#e5566f}
.tool svg{width:28px;height:28px}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #dd879d}
.tool[disabled]{opacity:.4}
.tool i{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;
  border:2px solid #fff;font:800 13px/20px system-ui;font-style:normal;text-align:center}
.tool i.pen{font-size:10px}
.tool i:empty{display:none}
.tool.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 4px 0 #dd879d,0 0 0 7px rgba(255,210,90,.6)}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;
  padding:9px 18px;border-radius:99px;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(120,70,30,.2);font-size:14px;white-space:nowrap;
  transition:opacity .25s,transform .25s;pointer-events:none}
#toast.hide{opacity:0;transform:translate(-50%,-8px)}
#rescue{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;margin:0 auto;max-width:420px;
  padding:14px;border-radius:20px;background:var(--panel2);box-shadow:0 12px 30px rgba(120,70,30,.28);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
#rescue b{display:block;font-size:16px;margin:0 2px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:14px;background:#f6eadb;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 #e2cdb4}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e2cdb4}
.btn.primary{background:linear-gradient(180deg,#ffa3b8,#ef6f8e);color:#fff;box-shadow:0 3px 0 #cf5574}
.btn.primary:active{box-shadow:0 1px 0 #cf5574}
.btn.ghost{background:none;box-shadow:none;color:var(--ink2)}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(90,50,30,.32);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#home{background:url(shop.jpg) center top/100% auto no-repeat,linear-gradient(180deg,var(--bg1),var(--bg0));align-items:stretch}
.panel{width:100%;max-width:420px;border-radius:26px;background:var(--panel);padding:22px 18px;
  box-shadow:0 20px 50px rgba(120,70,30,.3);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.home{display:flex;flex-direction:column;gap:12px;background:none;box-shadow:none;padding:max(14px,env(safe-area-inset-top)) 2px 10px;margin:0 auto;animation:none;min-height:0}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px auto 2px;padding:6px 20px 6px 12px;border-radius:99px;background:rgba(255,250,242,.88);box-shadow:0 4px 14px rgba(120,70,30,.15)}
.brand svg{width:52px;height:52px}
.brand h1{margin:0;font-size:32px;font-weight:900;letter-spacing:4px;color:#e5566f}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:18px;padding:12px 12px;text-align:left;background:#fff;border:2.5px solid transparent;box-shadow:0 3px 0 #ecdcc8}
.mode b{display:block;font-size:17px}
.mode small{color:var(--ink2);font-size:12px}
.mode.on{border-color:#2fb59c;background:#f0fbf7}
.mode[data-mode=challenge].on{border-color:var(--pink);background:#fff1f4}
.dcard{display:flex;align-items:center;gap:12px;border-radius:18px;padding:10px 14px;text-align:left;
  background:linear-gradient(100deg,#fff1cf,#fff9ec);border:2.5px solid #f4c562;box-shadow:0 3px 0 #ecd29a}
.dcard .cal{flex:none;width:42px;height:46px;border-radius:10px;background:#fff;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;text-align:center;box-shadow:0 1px 3px rgba(120,70,30,.2)}
.dcard .cal small{display:block;background:var(--red);color:#fff;font-size:11px;line-height:16px}
.dcard .cal b{font-size:20px;line-height:30px}
.dcard div{flex:1;min-width:0}
.dcard div b{display:block;font-size:17px}
.dcard div small{color:var(--ink2);font-size:12px}
.dcard em{flex:none;font-style:normal;font-size:13px;font-weight:800;color:var(--gold-hi)}
.dcard.done em{color:var(--ink2);font-weight:400}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px 2px 8px;align-content:start}
.cell{aspect-ratio:1;border-radius:16px;background:#fff;box-shadow:0 3px 0 #ecdcc8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:17px}
.cell small{font-size:10px;letter-spacing:1px;color:var(--gold);height:12px;line-height:12px}
.cell.cur{background:#fff1f4;box-shadow:0 3px 0 #f2b3c2,inset 0 0 0 2.5px var(--pink)}
.cell.hard{position:relative;background:#ffe9e6}
.cell.hard::after{content:"难";position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font:700 10px/16px system-ui}
.cell[disabled]{opacity:.4;box-shadow:none;background:rgba(255,255,255,.6)}
.opts{display:flex;gap:14px;justify-content:center;align-items:center;color:var(--ink2);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input{width:18px;height:18px;accent-color:var(--pink)}
.ver{text-align:center;color:var(--ink2);font-size:11px;opacity:.7;margin:0}
.pill{position:relative;padding:4px 12px;border-radius:99px;background:#fff3d6;border:1.5px solid #f4c562;color:var(--gold-hi);font-size:14px;font-weight:700}
.pill b{font-variant-numeric:tabular-nums}
.pill.new::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:99px;background:var(--red)}
#coll,#share{z-index:45}
.coll{display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 8px);overflow:auto}
.coll header{display:flex;align-items:baseline;justify-content:space-between}
.coll h2{margin:0;font-size:22px}
.coll h3{margin:4px 0 0;font-size:14px;color:var(--ink2);font-weight:700}
.coll header span{color:var(--gold-hi);font-weight:800}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border-radius:16px;padding:8px 6px 6px;background:#fff;border:2.5px solid transparent;box-shadow:0 2px 0 #ecdcc8;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px}
.item.on{border-color:var(--pink);background:#fff1f4}
.item[disabled]{opacity:.5}
.item small{font-size:11px;color:var(--gold-hi);height:14px}
.sw{width:100%;height:44px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.mt{width:22px;height:46px;border-radius:4px 4px 8px 8px;border:2px solid rgba(140,160,185,.8);background:rgba(255,255,255,.6);overflow:hidden;display:flex;flex-direction:column-reverse}
.mt i{flex:none;height:12px}
.share{text-align:center;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 8px)}
.share img{width:100%;min-height:0;object-fit:contain;border-radius:14px;flex:1}
.share p{margin:0;color:var(--ink2);font-size:13px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.win{text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:-4px 0 6px}
.stars svg{width:46px;height:46px;opacity:.18;transform:scale(.6);transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.stars svg.on{opacity:1;transform:scale(1)}
.stars svg:nth-child(2){margin-top:-10px;width:56px;height:56px}
.win h2{margin:0 0 6px;font-size:26px;font-weight:900;color:#e5566f}
.win p{margin:0 0 16px;color:var(--ink2)}
.win p b{color:var(--ink)}
@media (max-height:640px){.brand svg{width:42px;height:42px}.brand h1{font-size:26px}.tool{height:50px}#top{height:140px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
<div id="app">
  <div id="top">
    <header id="hud">
      <button id="homeBtn" class="icon" aria-label="关卡"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      <div class="lvl"><b id="lvlNum">第 1 关</b><span id="modeChip" class="chip">爽玩</span></div>
      <div class="stats"><span id="clock">0:00</span><span><b id="moves">0</b> 步</span></div>
    </header>
    <div id="orders"></div>
    <div id="counter"></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="banner" class="hide"><b></b><span></span></div><div id="tip" class="hide"><span></span></div><div id="hand" hidden></div></div>
  <nav id="tools">
    <button class="tool" data-tool="undo" aria-label="撤销"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><i></i></button>
    <button class="tool" data-tool="restart" aria-label="重来"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><i></i></button>
    <button class="tool" data-tool="tube" aria-label="加一个杯子"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11l-1.4 15H5.4z"/><path d="M4.6 11h9.8"/><path d="M19 8v6M16 11h6"/></svg><i></i></button>
    <button class="tool" data-tool="hint" aria-label="提示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="#ffd45a"/></svg><i></i></button>
  </nav>
  <div id="toast" class="hide"></div>
  <div id="rescue" hidden><b id="rsTitle">这条路走不通了</b><div class="row">
    <button class="btn primary" id="rsBack">退回</button><button class="btn" id="rsTube">加个空瓶</button><button class="btn ghost" id="rsClose">再想想</button></div></div>
  <div id="win" class="overlay" hidden><div class="panel win">
    <div class="stars" id="winStars"></div><h2 id="winTitle">漂亮</h2><p id="winInfo"></p>
    <div class="row" style="margin-bottom:8px"><button class="btn" id="winShare">晒成绩</button></div>
    <div class="row"><button class="btn ghost" id="winHome">关卡</button><button class="btn" id="winAgain">再玩一次</button><button class="btn primary" id="winNext">下一关</button></div>
  </div></div>
  <div id="coll" class="overlay" hidden><div class="panel coll">
    <header><h2>收藏</h2><span>★ <b id="collStars">0</b></span></header>
    <h3>背景</h3><div class="items" id="collBg"></div>
    <h3>液体</h3><div class="items" id="collLiq"></div>
    <button class="btn primary" id="collClose" style="flex:none">好了</button>
  </div></div>
  <div id="share" class="overlay" hidden><div class="panel share">
    <img id="shareImg" alt="成绩卡"><p>长按图片可以保存或发给朋友</p>
    <div class="row"><button class="btn ghost" id="shareClose">关闭</button><a class="btn" id="shareSave" download="倒倒乐成绩.png">保存图片</a><button class="btn primary" id="shareGo" hidden>分享</button></div>
  </div></div>
  <div id="home" class="overlay"><div class="panel home">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true">
      <g transform="rotate(-14 20 40)"><path d="M12 10v34a8 8 0 0 0 16 0V10" fill="rgba(255,255,255,.75)" stroke="#9fb2c8" stroke-width="2.4"/>
        <path d="M14 34h12v10a6 6 0 0 1-12 0z" fill="#e8463a"/><path d="M14 24h12v10H14z" fill="#f6d33c"/></g>
      <g transform="rotate(10 44 40)"><path d="M36 14v30a8 8 0 0 0 16 0V14" fill="rgba(255,255,255,.75)" stroke="#9fb2c8" stroke-width="2.4"/>
        <path d="M38 30h12v14a6 6 0 0 1-12 0z" fill="#3d7bf0"/><path d="M38 22h12v8H38z" fill="#33c4c0"/></g></svg><h1>倒倒乐</h1></div>
    <button class="dcard" id="dailyBtn"><span class="cal"><small id="dyMon"></small><b id="dyDay"></b></span><div><b>每日挑战</b><small id="dyInfo"></small></div><em id="dyGo"></em></button>
    <div class="modes"><button class="mode" data-mode="casual"><b>爽玩</b><small>点哪倒哪 · 不计时</small></button>
      <button class="mode" data-mode="challenge"><b>挑战</b><small>计时 · 道具有限</small></button></div>
    <button class="btn primary" id="playBtn" style="flex:none;height:52px;font-size:17px">开始</button>
    <div class="grid" id="grid"></div>
    <div class="opts"><button class="pill" id="collBtn">★ <b id="starTotal">0</b> 收藏</button><label><input type="checkbox" id="optSound">声音</label><label><input type="checkbox" id="optSym">颜色加图案</label></div>
    <p class="ver">v1.3 · 每关都保证有解</p>
  </div></div>
</div>
<script>
/*ENGINE-START*/
// ===== 规则引擎：纯函数，游戏和离线脚本共用同一份 =====
// 局面 s={cap, t:[[颜色,...],...]}，每个瓶子从底到顶
const CAP=4;
function rngOf(a){a=a>>>0;return function(){a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffleIn(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const topOf=t=>t.length?t[t.length-1]:-1;
function runOf(t){const c=topOf(t);let n=0;for(let i=t.length-1;i>=0&&t[i]===c;i--)n++;return n;}
// 凑满：同一种颜色的 4 格都在一个瓶里（小瓶装不下 4 格，永远不算凑满）
const isDone=(t,cap)=>t.length===cap&&runOf(t)===cap;
const isMono=t=>t.length>0&&runOf(t)===t.length;
// 局面里 caps（每个瓶子的容量，小瓶是 2）和 ice（冰冻瓶要先凑满几瓶才化开）是开局定好的，倒水时不变，复制时共用
const cpS=s=>({...s,t:s.t.map(x=>x.slice())});
const capOf=(s,i)=>s.caps?s.caps[i]:s.cap;
const doneCount=s=>{let n=0;for(const x of s.t)if(isDone(x,s.cap))n++;return n;};
const iceLeft=(s,i)=>s.ice&&s.ice[i]?Math.max(0,s.ice[i]-doneCount(s)):0;
// 能倒：两个瓶子都没冻着，源瓶有水且没凑满，目标瓶没满，目标是空瓶或顶上同色
function canPour(s,i,j){const a=s.t[i],b=s.t[j];return i!==j&&a.length>0&&b.length<capOf(s,j)&&!isDone(a,s.cap)&&(!b.length||topOf(b)===topOf(a))
  &&!(s.ice&&(iceLeft(s,i)||iceLeft(s,j)));}
// 顶上连着的同色一起倒，倒不下的留在原瓶
const pourAmt=(s,i,j)=>Math.min(runOf(s.t[i]),capOf(s,j)-s.t[j].length);
// 加一个普通空瓶（道具），容量和冰冻信息跟着补一位
function addEmpty(s){const r=cpS(s);r.t.push([]);if(r.caps)r.caps=[...r.caps,r.cap];if(r.ice)r.ice=[...r.ice,0];return r;}
function applyPour(s,i,j){const n=pourAmt(s,i,j),r=cpS(s),c=topOf(r.t[i]);for(let k=0;k<n;k++){r.t[i].pop();r.t[j].push(c);}return r;}
const isSolved=s=>s.t.every(x=>!x.length||isDone(x,s.cap));
function legalMoves(s){const m=[];for(let i=0;i<s.t.length;i++)for(let j=0;j<s.t.length;j++)if(canPour(s,i,j))m.push([i,j]);return m;}
// 求解用的步：整瓶单色倒进同样大的空瓶等于没走，同样大的空瓶只算第一个；去掉这些不会丢解
function usefulMoves(s){
  const m=[],e0=new Map();s.t.forEach((x,k)=>{const c=capOf(s,k);if(!x.length&&!iceLeft(s,k)&&!e0.has(c))e0.set(c,k);});
  for(let i=0;i<s.t.length;i++)for(let j=0;j<s.t.length;j++){
    if(!canPour(s,i,j))continue;
    if(!s.t[j].length&&(j!==e0.get(capOf(s,j))||isMono(s.t[i])&&capOf(s,i)===capOf(s,j)))continue;
    m.push([i,j]);
  }
  return m;
}
// 只剩单色瓶时，剩下的只是把同色并到一起，游戏会自动收尾
function onlyMerges(s){return s.t.every(x=>!x.length||isMono(x));}
// 局面指纹：瓶子顺序无关；小瓶和冰冻瓶跟普通瓶不能互换，前面加上记号
const keyOf=s=>s.t.map((x,k)=>(s.caps&&s.caps[k]!==s.cap?'s'+s.caps[k]:'')+(s.ice&&s.ice[k]?'i'+s.ice[k]:'')+String.fromCharCode(...x.map(c=>97+c))).sort().join('|');
// 估价：瓶内换色次数 + 每种颜色分散在几个瓶子
function heur(s){
  let h=0;const n=new Map();
  for(const x of s.t){for(let k=1;k<x.length;k++)if(x[k]!==x[k-1])h++;for(const c of new Set(x))n.set(c,(n.get(c)||0)+1);}
  for(const v of n.values())h+=v-1;
  return h;
}
// 加权 A*：w 越大越快、解越长。返回 {ok,path}；ok=false 且 capped=false 表示确定无解
function solve(s0,maxNodes=60000,w=2){
  if(isSolved(s0))return{ok:true,path:[]};
  const H=[];
  const push=n=>{H.push(n);let i=H.length-1;while(i){const p=i-1>>1;if(H[p].f<=n.f)break;H[i]=H[p];i=p;}H[i]=n;};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){let i=0;for(;;){const l=2*i+1,r=l+1;let m=-1,f=last.f;
    if(l<H.length&&H[l].f<f){m=l;f=H[l].f;}if(r<H.length&&H[r].f<f)m=r;if(m<0)break;H[i]=H[m];i=m;}H[i]=last;}return top;};
  const seen=new Map([[keyOf(s0),0]]);let nodes=0,ord=0;
  push({s:s0,g:0,f:w*heur(s0),mv:null,par:null});
  while(H.length){
    const n=pop();if(++nodes>maxNodes)return{ok:false,capped:true,nodes};
    for(const [i,j] of usefulMoves(n.s)){
      const s=applyPour(n.s,i,j),k=keyOf(s),g=n.g+1;
      if(seen.has(k)&&seen.get(k)<=g)continue;seen.set(k,g);
      const c={s,g,f:g+w*heur(s)-(++ord)*1e-9,mv:[i,j],par:n};
      if(isSolved(s)){const path=[];for(let x=c;x.mv;x=x.par)path.push(x.mv);return{ok:true,path:path.reverse(),nodes};}
      push(c);
    }
  }
  return{ok:false,capped:false,nodes};
}

// ===== 关卡参数：第 1 关教学，第 2 关巩固，第 3 关开始有挑战；之后「紧—松—中」循环，颜色逐渐变多 =====
// pick 是离线选关时在一批候选里取第几百分位的难度（1 最难，0 最容易）；adj 是开局同瓶相邻同色的上限；
// hard 是「紧」关里不带问号的那些，界面上标成困难关、多给道具；
// 新玩法：第 18 关起冰冻瓶（ice 是每个冰冻瓶要先凑满几瓶），第 34 关起小瓶（small 个 2 格小瓶顶替一个空瓶）
function mechOf(L){
  const ice=L===18||L>18&&L%5===3,small=L===34||L>34&&L%5===4;
  return{...(ice?{ice:L<30?[1]:[1,2]}:{}),...(small?{small:2}:{})};
}
function baseParams(L){
  const P=baseParams0(L),M=mechOf(L),intro=L===18||L===34?{pick:.2}:{};
  return M.small?{...P,...M,...intro,empty:P.empty-1}:{...P,...M,...intro};
}
function baseParams0(L){
  if(L===1)return{fixed:[[0,0,6,6],[6,6,0,0],[]],colors:2,empty:1,pick:.5};
  if(L===2)return{colors:4,empty:2,adj:5,pick:.1};
  if(L===3)return{colors:6,empty:2,adj:2,pick:.85};
  if(L===4)return{colors:6,empty:2,adj:3,pick:.4};
  if(L===5)return{colors:7,empty:2,adj:2,pick:.8};
  if(L===6)return{colors:7,empty:2,adj:3,pick:.2};
  if(L===7)return{colors:8,empty:2,adj:2,pick:.8,hard:true};
  const colors=Math.min(12,8+Math.floor((L-8)/6)),hidden=L===8||(L>8&&L%4===0),k=L%3;
  if(k===2)return{colors,empty:2,adj:1,hidden,pick:hidden?.5:.85,hard:!hidden&&L>=11};
  if(k===0)return{colors:colors-1,empty:2,adj:3,hidden,pick:.15};
  return{colors,empty:2,adj:2,hidden,pick:hidden?.3:.5};
}
// 爽玩：颜色少、颜色多时多给一个空瓶、没有问号，只挑最顺的局
function levelParams(L,mode){
  const P=baseParams(L);if(mode!=='casual'||P.fixed)return P;
  const colors=Math.min(10,Math.max(3,P.colors-(L<=4?1:2)));
  return{...P,colors,empty:(colors>=8?3:2)-(P.small?1:0),adj:P.adj+2,hidden:false,pick:.05,hard:false};
}
function generateSeed(L,seed,mode='challenge'){
  const P=levelParams(L,mode);
  if(P.fixed)return{s:{cap:CAP,t:P.fixed.map(x=>x.slice())},P,seed};
  const rng=rngOf(seed*7919+L*104729+(mode==='casual'?17:0));
  const s=deal(P,rng);return s&&{s,P,seed};
}
// 按参数随机摆一局：顶上不能已经连着 3 格同色，同瓶相邻同色不超过 adj；再按需要冻住几瓶、放几个小瓶
function deal(P,rng){
  const t=dealTubes(P,rng);if(!t)return null;
  const s={cap:CAP,t};
  if(P.ice){const full=shuffleIn(t.map((_,k)=>k).filter(k=>t[k].length),rng);s.ice=t.map(()=>0);P.ice.forEach((n,k)=>s.ice[full[k]]=n);}
  if(P.small){s.caps=t.map(()=>CAP);for(let k=0;k<P.small;k++){s.t.push([]);s.caps.push(2);if(s.ice)s.ice.push(0);}}
  return s;
}
function dealTubes(P,rng){
  const cols=shuffleIn([...Array(12).keys()],rng).slice(0,P.colors);
  for(let a=0;a<400;a++){
    const u=[];for(const c of cols)for(let k=0;k<CAP;k++)u.push(c);shuffleIn(u,rng);
    const t=[];for(let i=0;i<P.colors;i++)t.push(u.slice(i*CAP,i*CAP+CAP));for(let e=0;e<P.empty;e++)t.push([]);
    let adj=0,bad=false;
    for(const x of t){if(x.length&&runOf(x)>=3)bad=true;for(let k=1;k<x.length;k++)if(x[k]===x[k-1])adj++;}
    if(!bad&&adj<=P.adj)return t;
  }
  return null;
}
// 模拟一个会撤销的普通玩家：偏爱倒在同色上、不走回头路，走进死路就退一步。统计每局要退多少次（取中位数）
function deadStats(s0,n=12,seed=1){
  const rng=rngOf(seed*31+7),ds=[];let zero=0;
  for(let p=0;p<n;p++){
    const vis=new Set([keyOf(s0)]),st=[{s:s0,opts:null}];let dead=0,nodes=0;
    while(st.length){
      const top=st[st.length-1];
      if(onlyMerges(top.s))break;
      if(!top.opts)top.opts=usefulMoves(top.s).map(([i,j])=>{const t=applyPour(top.s,i,j),b=top.s.t[j];
        let w=b.length?4:1;if(b.length&&isMono(b))w+=2;if(isDone(t.t[j],t.cap))w+=6;return{t,w,k:keyOf(t)};});
      const av=top.opts.filter(o=>!vis.has(o.k));
      if(!av.length){st.pop();dead++;continue;}
      let r=rng()*av.reduce((a,o)=>a+o.w,0),o=av[0];for(const x of av){r-=x.w;if(r<=0){o=x;break;}}
      vis.add(o.k);st.push({s:o.t,opts:null});
      if(++nodes>4000){dead=999;break;}
    }
    ds.push(dead);if(!dead)zero++;
  }
  ds.sort((a,b)=>a-b);
  return{dead:ds[n>>1],zero:zero/n};
}
function scoreLevel(g,n=12){
  const r=solve(g.s,80000,1.5);if(!r.ok)return null;
  return{...deadStats(g.s,n,g.seed),par:r.path.length};
}
/*SEEDS-START*/const LEVEL_SEEDS=[[1,3],[3,11],[18,19],[6,19],[16,23],[9,21],[8,27],[15,28],[11,25],[10,28],[5,29],[20,25],[10,27],[19,33],[16,28],[11,31],[12,35],[6,27],[12,29],[15,38],[12,31],[13,36],[24,34],[17,30],[11,32],[13,41],[14,35],[12,35],[11,38],[3,35],[19,36],[10,43],[2,38],[22,51],[19,41],[20,39],[2,45],[8,46],[16,41],[11,41],[22,41],[6,36],[11,41],[9,47],[23,37],[14,42],[1,42],[22,37],[4,49],[12,42],[20,38],[24,40],[18,41],[1,42],[8,43],[24,44],[21,37],[21,44],[20,50],[21,38]];/*SEEDS-END*/
/*CASUAL-SEEDS-START*/const CASUAL_SEEDS=[[1,3],[2,9],[4,16],[5,15],[7,17],[3,15],[2,20],[6,18],[2,16],[12,20],[11,18],[2,17],[10,17],[1,24],[9,17],[5,23],[2,22],[9,20],[11,24],[2,26],[23,25],[2,27],[5,27],[7,20],[2,26],[10,30],[2,28],[5,32],[4,31],[4,27],[4,32],[13,34],[13,31],[2,39],[18,35],[5,33],[15,35],[15,33],[2,31],[11,32],[14,34],[3,31],[15,34],[8,35],[3,33],[10,32],[13,33],[9,31],[4,34],[8,33],[3,31],[12,35],[1,38],[2,33],[10,32],[22,33],[2,30],[24,33],[4,35],[7,30]];/*CASUAL-SEEDS-END*/
// 表里存 [种子, 标准步数]；超出表的关卡现场挑一个有解的
function generate(L,mode='challenge'){
  const tab=mode==='casual'?CASUAL_SEEDS:LEVEL_SEEDS,e=tab[L-1];
  if(e){const g=generateSeed(L,e[0],mode);if(g)return{...g,par:e[1]};}
  for(let seed=1;seed<60;seed++){
    const g=generateSeed(L,seed,mode);if(!g)continue;
    const r=solve(g.s,40000,2);if(r.ok)return{...g,par:r.path.length};
  }
  return null;
}
// 每日挑战：按日期（本地日期折成天数）出题，同一天所有人是同一局。平日 10 色，周末 11 色带问号
function dailyParams(day){
  const wd=(day+4)%7,weekend=wd===0||wd===6;
  return{colors:weekend?11:10,empty:2,adj:2,hidden:weekend};
}
function generateDaily(day){
  const P=dailyParams(day);
  for(let seed=1;seed<40;seed++){
    const s=deal(P,rngOf(day*2654435+seed*7919+99991));if(!s)continue;
    const r=solve(s,80000,1.5);if(r.ok)return{s,P,seed,par:r.path.length};
  }
  return null;
}
/*ENGINE-END*/
</script>
<script>
(()=>{

function tone(f,dur,type,vol,when=0,glide=0){

};
function buzz(ms){try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(ms);}catch(e){}}

// ===== 瓶子几何：本地坐标 u 向右、v 向上，原点在瓶底中心。液体按面积计算，倾斜时液面保持水平 =====
const GEO={w:0};
function clipPoly(P,sn,cs,c){
  const out=[],f=p=>-p[0]*sn+p[1]*cs-c;
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[(i+1)%P.length],fa=f(a),fb=f(b);
    if(fa<=0)out.push(a);
    if((fa<0&&fb>0)||(fa>0&&fb<0)){const t=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
  }
  return out;
}
function areaOf(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}

function levelC(th,A,g=GEO){
  const key=Math.round(th*2000)+'|'+Math.round(A*4);
  let v=g.lc.get(key);if(v!==undefined)return v;
  const P=g.P,sn=Math.sin(th),cs=Math.cos(th);let lo=Infinity,hi=-Infinity;
  for(const p of P){const h=-p[0]*sn+p[1]*cs;if(h<lo)lo=h;if(h>hi)hi=h;}

    for(let k=0;k<22;k++){const m=(lo+hi)/2;if(areaOf(clipPoly(P,sn,cs,m))<A)lo=m;else hi=m;}

const TUBE_R=2.3;
function tubeShape(w,H){

// 每格液体面积所有瓶子都一样；小瓶只是矮一截

  g.uc=[];for(let u=0;u<cap;u++)g.uc.push(levelC(0,(u+.5)*g.unitA,g));

function layout(animate){

  // 试 1～3 排，取瓶子能画得最大的排法；差不多大时少排优先
  const n=TUBES.length,avail=Hs-44;let best=null;
  for(let rows=1;rows<=Math.min(3,n);rows++){
    const per=Math.ceil(n/rows);let sp=Math.min(W/(per+.5),120),w=Math.min(sp*.74,84);
    const h=avail/(rows*TUBE_R+(rows-1)*1.9+1.6);if(w>h)w=h;

    case 2:ctx.rect(-s*.85,-s*.85,s*1.7,s*1.7);break;
    case 3:ctx.moveTo(0,-s*1.15);ctx.lineTo(s,0);ctx.lineTo(0,s*1.15);ctx.lineTo(-s,0);break;
    case 4:for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s*1.15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}break;

    case 8:for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);}break;
    case 9:ctx.rect(-s,-s*.3,s*2,s*.6);break;
    case 10:ctx.arc(-s*.5,0,s*.45,0,7);ctx.moveTo(s*.95,0);ctx.arc(s*.5,0,s*.45,0,7);break;
    default:ctx.moveTo(-s,-s*.6);ctx.lineTo(-s*.6,-s);ctx.lineTo(s,s*.6);ctx.lineTo(s*.6,s);ctx.closePath();ctx.moveTo(s,-s*.6);ctx.lineTo(s*.6,-s);ctx.lineTo(-s,s*.6);ctx.lineTo(-s*.6,s);

function drawTube(T,ox,oy,th,t){
  const g=geoT(T),w=g.w,H=g.H,thL=th+T.sl;
  ctx.save();ctx.translate(ox,oy);ctx.rotate(th);ctx.scale(1,-1);
  // 完成后的光晕
  if(T.doneT>0&&t-T.doneT<1100){const p=(t-T.doneT)/1100,top=T.segs[T.segs.length-1];
    ctx.save();ctx.globalAlpha=(1-p)*.55;ctx.fillStyle=top?PAL[top.c]:'#fff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=26*(1-p)+6;
    tubePath(g);ctx.closePath();ctx.fill();ctx.restore();}
  if(G.liq==='neon'&&T.segs.length){const vol=volOf(T),tc=T.segs[T.segs.length-1];
    if(vol>.02){ctx.save();ctx.shadowColor=tc.hid?HID:PAL[tc.c];ctx.shadowBlur=w*.75;ctx.fillStyle=ctx.shadowColor;
      fillPoly(clipPoly(g.P,Math.sin(thL),Math.cos(thL),levelC(thL,vol*g.unitA,g)));ctx.restore();}}
  tubePath(g);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();
  ctx.save();tubePath(g);ctx.closePath();ctx.clip();
  // 液面按 th+晃动角 算：晃动只改液面朝向，面积不变
  const sn=Math.sin(thL),cs=Math.cos(thL),segs=T.segs,lv=[];let cum=0;
  for(const s of segs){cum+=s.v;lv.push(levelC(thL,cum*g.unitA,g));}
  for(let k=segs.length-1;k>=0;k--){

function poseOf(T,t){

  // 杯底的影子：拿起来时变淡变小
  for(const T of TUBES){if(T.pose||T.drag)continue;const gw=geoT(T).w,k=1-clamp(T.lift/60,0,.4);
    ctx.fillStyle=`rgba(130,80,40,${.17*k})`;ctx.beginPath();ctx.ellipse?ctx.ellipse(T.x,T.y+2,gw*.66*k,gw*.14*k,0,0,7):ctx.rect(T.x-gw*.6,T.y,gw*1.2,4);ctx.fill();}
  // 可以倒进去的瓶子：瓶口上方的小箭头
  const src=G.sel>=0?G.sel:-1;
  if(src>=0){const bob=Math.sin(t/170)*3;
    TUBES.forEach((T,j)=>{if(j!==src&&!T.busy&&canPour(G.s,src,j))drawChevron(T.x,T.y-geoT(T).H-16+bob,'#ee7895');});}
  if(G.hint&&t<G.hint.until){const T=TUBES[G.hint.j];if(T)drawChevron(T.x,T.y-geoT(T).H-16+Math.sin(t/170)*3,'#ff9a2e');}
  const front=[];
  TUBES.forEach((T,i)=>{if(T.pose||T.drag)front.push(T);else{const p=poseOf(T,t);drawTube(T,p.ox,p.oy,p.th,t);}});
  for(const a of G.anims)if(a.stream)drawStream(a,t);
  for(const T of front){const p=poseOf(T,t);drawTube(T,p.ox,p.oy,p.th,t);}
  // 冰冻瓶上方的数字：还要凑满几瓶
  TUBES.forEach((T,i)=>{if(!T.frozen)return;const n=iceLeft(G.s,i);if(!n)return;const p=poseOf(T,t),y=p.oy-geoT(T).H-w*.55,r=Math.max(10,w*.3);
    ctx.fillStyle='#7cc8ff';ctx.beginPath();ctx.arc(p.ox,y,r,0,7);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#e8f6ff';ctx.stroke();
    ctx.fillStyle='#0d2a44';ctx.font=`800 ${Math.round(r*1.15)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,p.ox,y+1);});
  drawFx(t);
}
function drawStream(a,t){
  const s=a.stream,w=GEO.w,B=TUBES[a.j],surf=B.y-levelC(0,volOf(B)*GEO.unitA,geoT(B))+2;
  const y0=s.y0,y1=Math.max(y0,Math.min(surf,y0+(surf-y0)*s.head)),yTop=y0+(surf-y0)*s.tail;
  if(y1-yTop<1)return;
  const wid=w*.17*(s.tail>0?1-s.tail*.5:1);
  ctx.save();ctx.fillStyle=PAL[a.c];
  ctx.beginPath();ctx.moveTo(s.x0-wid/2,yTop);ctx.quadraticCurveTo(B.x-wid/2,yTop+(y1-yTop)*.3,B.x-wid/2,y1);
  ctx.lineTo(B.x+wid/2,y1);ctx.quadraticCurveTo(B.x+wid/2,yTop+(y1-yTop)*.3,s.x0+wid/2,yTop);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(B.x-wid*.15,yTop+(y1-yTop)*.35,wid*.22,(y1-yTop)*.6);
  ctx.restore();
}

// ===== 粒子与飘字（同一块画布） =====
const FX=[];
function burst(x,y,col,n,sp=1){n=reduceMotion?Math.ceil(n/4):n;
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.6,v=(.12+Math.random()*.32)*sp;
    FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.0009,life:0,max:600+Math.random()*500,s:2+Math.random()*3.5,c:Math.random()<.3?'#fff':col,star:Math.random()<.35,r:Math.random()*6});}
  kick();}
// 水花：小圆点，往上溅一点就落回去
function splash(x,y,col,n){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=.08+Math.random()*.16;
  FX.push({x:x+(Math.random()-.5)*6,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.0011,life:0,max:260+Math.random()*220,s:1.4+Math.random()*2.2,c:Math.random()<.25?'#fff':col,drop:true});}kick();}
function floatText(x,y,text,col){FX.push({x,y,vx:0,vy:-.05,g:0,life:0,max:1100,text,c:col});kick();}
function confetti(){const n=reduceMotion?30:150;
  for(let i=0;i<n;i++)FX.push({x:Math.random()*R.W,y:-20-Math.random()*R.H*.5,vx:(Math.random()-.5)*.08,vy:.08+Math.random()*.14,g:.00006,life:0,
    max:3000+Math.random()*1200,s:4+Math.random()*5,c:PAL[i%PAL.length],r:Math.random()*6,flut:Math.random()*6});kick();}
let fxLast=0;
function drawFx(t){
  const dt=Math.min(40,t-(fxLast||t));fxLast=t;
  for(let i=FX.length-1;i>=0;i--){const p=FX[i];p.life+=dt;if(p.life>=p.max){FX.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt+(p.flut?Math.sin(p.life/300+p.flut)*.3:0);p.y+=p.vy*dt;p.r+=.01*dt;
    const k=1-p.life/p.max;ctx.globalAlpha=Math.min(1,k*1.8);ctx.fillStyle=p.c;
    if(p.text){ctx.save();const sc=1+Math.max(0,.3-p.life/600);ctx.translate(p.x,p.y);ctx.scale(sc,sc);ctx.font='800 22px system-ui';ctx.textAlign='center';
      ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.strokeText(p.text,0,0);ctx.fillText(p.text,0,0);ctx.restore();continue;}
    if(p.drop){ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    if(p.star){const s=p.s*1.3;ctx.beginPath();for(let j=0;j<8;j++){const rr=j%2?s*.35:s,a=j*Math.PI/4;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
    else ctx.fillRect(-p.s/2,-p.s*.35,p.s,p.s*.7);
    ctx.restore();}
  ctx.globalAlpha=1;
}

// ===== 液面晃动：倾斜角或横向速度一变，液面就偏离水平，再像弹簧一样晃回来 =====
function slosh(T,t,dt){
  if(reduceMotion){T.sl=0;return false;}
  const p=poseOf(T,t),vx=T.pox===undefined?0:(p.ox-T.pox)/Math.max(1,dt);
  if(T.pth!==undefined&&dt>0)T.sv+=(p.th-T.pth)*.0015/Math.max(1,dt)*16-(vx-(T.pvx||0))*.0009;
  T.pox=p.ox;T.pth=p.th;T.pvx=vx;
  T.sv+=(-T.sl*1.9e-4-T.sv*.0042)*dt;T.sl=clamp(T.sl+T.sv*dt,-.32,.32);
  if(Math.abs(T.sl)<.002&&Math.abs(T.sv)<2e-5){T.sl=0;T.sv=0;return false;}
  return true;
}
function wobble(i,k=1){const T=TUBES[i];if(T){T.sv+=(Math.random()<.5?-1:1)*.0011*k;kick();}}
// ===== 主循环：有动画时才跑 =====
function kick(ms=0){R.until=Math.max(R.until,now()+ms);if(!R.raf)R.raf=requestAnimationFrame(frame);}
function frame(t){
  R.raf=0;const dt=Math.min(40,t-(R.last||t));R.last=t;let active=false;
  for(const a of G.anims.slice())a.update(t);
  G.anims=G.anims.filter(a=>!a.done);if(G.anims.length)active=true;
  TUBES.forEach((T,i)=>{
    const lt=G.sel===i&&!T.drag?LIFT:0;T.lift+=(lt-T.lift)*Math.min(1,dt*.02);if(Math.abs(lt-T.lift)>.3)active=true;else T.lift=lt;
    const k=Math.min(1,dt*.012);T.x+=(T.hx-T.x)*k;T.y+=(T.hy-T.y)*k;if(Math.abs(T.hx-T.x)+Math.abs(T.hy-T.y)>.5)active=true;else{T.x=T.hx;T.y=T.hy;}
    if(T.drag)active=true;
    if(slosh(T,t,dt))active=true;
  });
  draw(t);
  if(FX.length||t<R.until||G.sel>=0||(G.hint&&t<G.hint.until))active=true;
  if(active)R.raf=requestAnimationFrame(frame);
}

// ===== 倒水动画：先把逻辑局面改好，画面再慢慢跟上；参与的两个瓶子在动画期间不能再操作 =====
function pourDir(A,B){
  const w=GEO.w,H=GEO.H;let s=A.x<=B.x?1:-1;
  if(s>0&&B.x-H*.95<4)s=-1;else if(s<0&&B.x+H*.95>R.W-4)s=1;
  return s;
}
function originFor(P,th,s,g=GEO){const w=g.w,H=g.H,sx=s*w/2,c=Math.cos(th),n=Math.sin(th);return{ox:P.x-(sx*c+H*n),oy:P.y-(sx*n-H*c)};}
function startPour(i,j,opt={}){
  const t=now(),s0=G.s,n=pourAmt(s0,i,j),c=topOf(s0.t[i]);
  pushHist();
  G.s=applyPour(s0,i,j);
  for(let k=0;k<n;k++){G.hid[i].pop();G.hid[j].push(false);}
  // 源瓶新露出的一截如果是问号，翻开
  const ti=G.s.t[i];let revealed=false;
  if(ti.length){const run=runOf(ti);for(let k=ti.length-run;k<ti.length;k++)if(G.hid[i][k]){G.hid[i][k]=false;revealed=true;}}
  G.moves++;G.sel=-1;G.hint=null;hand(null);hideRescue();
  if(!opt.auto){timerStart();if(G.script&&G.step<G.script.length)G.step++;}
  hud();
  const A=TUBES[i],B=TUBES[j],sp=opt.speed||1;
  A.busy++;B.busy++;
  const start=poseOf(A,t);A.drag=null;A.pose={...start};
  const top=A.segs[A.segs.length-1];
  let bt=B.segs[B.segs.length-1];if(!bt||bt.c!==c||bt.hid){bt={c,v:0,hid:false,rev:0};B.segs.push(bt);}
  const gA=geoT(A),gB=geoT(B),dir=pourDir(A,B),P={x:B.x,y:B.y-gB.H-GEO.w*.45-4};
  const A0=volOf(A)*GEO.unitA,th0=dir*Math.max(0,pourAngle(A0,gA)-.05);
  const dMove=260/sp,dFlow=Math.max(300,n*210)/sp,dBack=250/sp;
  const fill0=volOf(B)/B.cap,fill1=(volOf(B)+n)/B.cap;
  const a={i,j,c,n,t0:t,done:false,stream:null,flowed:false,
    update(t){
      const e=t-this.t0;
      if(e<dMove){const p=easeIO(e/dMove),o=originFor(P,th0,dir,gA);
        A.pose={ox:start.ox+(o.ox-start.ox)*p,oy:start.oy+(o.oy-start.oy)*p,th:start.th+(th0-start.th)*p};return;}
      if(e<dMove+dFlow){
        const q=(e-dMove)/dFlow;
        if(!this.stream){this.stream={x0:P.x,y0:P.y,head:0,tail:0};sfx.pour(fill0,fill1,dFlow/1000);}
        this.stream.head=Math.min(1,(e-dMove)/90);
        const moved=n*q,lag=n*clamp((e-dMove-70)/(dFlow-70),0,1);
        top.v=Math.max(0,top.v0-moved);bt.v=bt.v0+lag;
        const th=dir*pourAngle(A0-moved*GEO.unitA,gA);A.pose={...originFor(P,th,dir,gA),th};
        this.lastTh=th;
        // 水柱落到液面溅起水花，目标瓶液面跟着晃
        if(!reduceMotion&&t-(this.spl||0)>65&&this.stream.head>=1){this.spl=t;const sy=B.y-levelC(0,volOf(B)*GEO.unitA,gB);splash(B.x,sy,PAL[c],q<.15?6:3);B.sv+=(Math.random()-.5)*.0016;}
        return;
      }
      if(!this.flowed){this.flowed=true;top.v=top.v0-n;bt.v=bt.v0+n;B.busy--;finishTarget(j,c);}
      const e2=e-dMove-dFlow;
      if(this.stream){this.stream.tail=Math.min(1,e2/110);if(e2>110)this.stream=null;}
      const p=easeIO(Math.min(1,e2/dBack)),o=originFor(P,this.lastTh,dir,gA),hx=A.x,hy=A.y;
      A.pose={ox:o.ox+(hx-o.ox)*p,oy:o.oy+(hy-o.oy)*p,th:this.lastTh*(1-p)};
      if(e2>=dBack){
        this.done=true;A.pose=null;A.lift=0;A.busy--;wobble(i,.7);
        const old=A.segs;A.segs=segsOf(i);
        if(revealed){const tp=A.segs[A.segs.length-1];if(tp)tp.rev=now();sfx.reveal();burst(A.x,A.y-GEO.H*.4,'#fff',10,.6);}
        afterAnims();
      }
    }};
  top.v0=top.v;bt.v0=bt.v;a.lastTh=th0;
  G.anims.push(a);kick();
  if(!opt.auto)sfx.pick();
  checkAuto();
  updateGuide();
}
function finishTarget(j,c){
  const B=TUBES[j];B.segs=segsOf(j);
  if(isDone(G.s.t[j],CAP)&&B.doneT===0){
    const t=now();B.doneT=t;
    G.combo=t-G.lastDone<COMBO_MS?G.combo+1:1;G.lastDone=t;G.maxCombo=Math.max(G.maxCombo,G.combo);
    sfx.done(G.combo);setTimeout(()=>sfx.cork(),260);buzz(18);
    burst(B.x,B.y-GEO.H,PAL[c],22,1);serveOrder(c);
    if(G.combo>=2)floatText(B.x,B.y-GEO.H-34,`连成 ×${G.combo}`,'#ff7a45');
    kick(1400);
    // 凑满一瓶后，够数的冰冻瓶化开
    TUBES.forEach((T,k)=>{if(T.frozen&&!iceLeft(G.s,k)){T.frozen=false;T.thawT=t+250;
      setTimeout(()=>{sfx.thaw();burst(T.x,T.y-geoT(T).H*.5,'#cfeaff',26,.8);T.shakeT=now();kick(700);},250);}});
  }
}
function afterAnims(){
  if(G.anims.some(a=>!a.done&&a.update))return;
  if(isSolved(G.s)&&!G.won){G.won=true;setTimeout(winLevel,650);return;}
  if(!G.auto)setTimeout(checkDead,40);
}

// ===== 自动收尾：只剩单色瓶时，把同色并到一起，可以同时倒好几瓶 =====
function checkAuto(){
  if(G.auto||isSolved(G.s)||!onlyMerges(G.s))return;
  G.auto=true;G.sel=-1;
  setTimeout(()=>{toast('自动收尾',1200);autoStep();},280);
}
function autoStep(){
  if(!G.active||!G.auto)return;
  if(isSolved(G.s)){G.auto=false;return;}
  const s=G.s,by=new Map();
  s.t.forEach((x,k)=>{if(x.length&&!isDone(x,CAP)){const c=x[0];if(!by.has(c))by.set(c,[]);by.get(c).push(k);}});
  let issued=false;
  for(const ks of by.values()){
    if(ks.length<2)continue;
    // 往普通瓶里并；这种颜色全在小瓶里时，先倒进一个普通空瓶
    const big=ks.filter(k=>capOf(s,k)>=CAP);
    const tgt=big.length?big.reduce((a,b)=>s.t[b].length>s.t[a].length?b:a):s.t.findIndex((x,k)=>!x.length&&capOf(s,k)>=CAP&&!iceLeft(s,k));
    if(tgt<0)continue;
    const src=ks.find(k=>k!==tgt&&!TUBES[k].busy);
    if(src!==undefined&&!TUBES[tgt].busy&&canPour(s,src,tgt)){startPour(src,tgt,{auto:true,speed:1.45});issued=true;break;}
  }
  setTimeout(autoStep,issued?150:90);
}

// ===== 走不通时的救场：撤销到最近一个还能解的局面，或者加一个空瓶 =====
function solvable(s,cap=6000){const r=solve(s,cap,2.5);return r.ok||r.capped;}
function checkDead(){
  if(G.anims.length||G.auto||G.won||isSolved(G.s)||!G.active)return;
  const s=G.s,stuck=!usefulMoves(s).length;
  let dead=stuck;
  if(!dead&&casual()){const r=solve(s,6000,3);dead=!r.ok&&!r.capped;}
  if(dead)showRescue(stuck);
}
function backSteps(){for(let k=G.hist.length-1;k>=0;k--)if(solvable(G.hist[k].s))return G.hist.length-k;return G.hist.length;}
function showRescue(stuck){
  const n=backSteps();G.rescue={n};
  $('rsTitle').textContent=stuck?'没有能倒的了':'这条路走不通了';
  $('rsBack').textContent=`退回 ${n} 步`;$('rsBack').hidden=!n;
  $('rsTube').hidden=G.added>=G.tools.tube;
  $('rescue').hidden=false;
}
function hideRescue(){$('rescue').hidden=true;G.rescue=null;}

// ===== 历史与道具 =====
function pushHist(){G.hist.push({s:cpS(G.s),hid:G.hid.map(x=>x.slice()),moves:G.moves});}
function restore(k){
  const h=G.hist[k];G.hist.length=k;G.s=cpS(h.s);G.hid=h.hid.map(x=>x.slice());G.moves=h.moves;
  TUBES.forEach((T,i)=>{T.segs=segsOf(i);T.doneT=isDone(G.s.t[i],CAP)?(T.doneT||-1e9):0;T.shakeT=now()-120;
    if(iceLeft(G.s,i)&&!T.frozen){T.frozen=true;T.thawT=0;}});
  G.sel=-1;G.hint=null;G.auto=false;hud();syncOrders();kick(400);
}
function idle(){return!G.anims.length&&!G.auto&&!G.won&&G.active;}
function spend(tool){
  if(casual())return true;
  if(G.tools[tool]>0){G.tools[tool]--;hud();return true;}
  G.penalty+=PENALTY_MS;drawClock();toast('次数用完了，计时 +20 秒');const c=$('clock');c.classList.add('pen');setTimeout(()=>c.classList.remove('pen'),900);
  return true;
}
function useUndo(n=1){
  if(!idle())return;
  if(!G.hist.length){toast('还没倒过');return;}
  spend('undo');restore(Math.max(0,G.hist.length-n));sfx.undo();hideRescue();updateGuide();
}
function useHint(){
  if(!idle())return;
  let r=solve(G.s,30000,1.5);if(!r.ok&&r.capped)r=solve(G.s,80000,4);
  if(r.ok&&r.path.length){spend('hint');const [i,j]=r.path[0];G.hint={i,j,until:now()+5000};G.sel=-1;sfx.hint();handPath(i,j);kick();return;}
  if(!r.ok&&!r.capped){showRescue(false);return;}
  toast('这一步我也没算出来，先退回几步试试');
}
function useTube(){
  if(!idle())return;
  if(G.added>=G.tools.tube){toast(G.tools.tube===1?'每关只能加一个空瓶':`每关最多加 ${G.tools.tube} 个空瓶`);return;}
  G.added++;G.s=addEmpty(G.s);G.hid.push([]);
  for(const h of G.hist){h.s=addEmpty(h.s);h.hid.push([]);}
  const T=newTube(G.s.t.length-1);TUBES.push(T);layout(true);T.x=T.hx;T.y=T.hy;T.shakeT=now()-100;
  sfx.tube();hideRescue();hud();burst(T.hx,T.hy-GEO.H*.5,'#ffffff',14,.7);
}
function restart(){if(G.anims.length)return;startLevel(G.L,true,G.daily);}

// ===== 计时（只在挑战模式显示） =====
let clockH=0;
function timerStart(){if(G.running||G.won)return;G.running=true;G.t0=now();clearInterval(clockH);clockH=setInterval(drawClock,250);}
function timerPause(){if(!G.running)return;G.ms+=now()-G.t0;G.running=false;clearInterval(clockH);drawClock();}
const timeMs=()=>G.ms+(G.running?now()-G.t0:0)+G.penalty;
const fmt=ms=>{const s=Math.floor(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
function drawClock(){$('clock').textContent=fmt(timeMs());}

// ===== 引导：第 1 关手把手，之后几关各提示一句 =====
const GUIDE={
  challenge:[['点一下瓶子，拿起来','再点空瓶，倒进去'],['拿起顶上是红色的瓶子','倒在红色上面']],
  casual:[['点一下瓶子，它会自己找地方倒',''],['再点一下，红色会倒到红色上面','']],
};
const TIPS={
  2:{both:'顶上连着的同色会一起倒；倒不下的留在原瓶'},
  3:{challenge:'卡住了可以撤销，提示会告诉你下一步',casual:'想倒到指定的瓶子，直接拖过去'},
  4:{both:'实在转不开，可以加一个空瓶',pulse:'tube'},
  8:{both:'问号要等上面倒走，才会显出颜色'},
  18:{both:'冰冻瓶上的数字：再凑满几瓶，冰就化了'},
  34:{both:'小瓶只装 2 格，过关时要倒空'},
};
const INTRO={18:['新玩法 · 冰冻瓶','先凑满别的颜色，冰才会化开'],34:['新玩法 · 小瓶','只装 2 格，过关时要倒空']};
let tipH=0;
function tip(text,ms=0){const el=$('tip');clearTimeout(tipH);if(!text){el.classList.add('hide');return;}
  el.firstChild.textContent=text;el.classList.remove('hide');if(ms)tipH=setTimeout(()=>el.classList.add('hide'),ms);}
function updateGuide(){
  if(!G.script||!G.active||!$('home').hidden)return;
  if(G.step>=G.script.length){hand(null);if(G.step===G.script.length){G.step++;tip('只剩单色时，会自动帮你收尾',3200);}return;}
  const [a,b]=G.script[G.step],txt=GUIDE[rules()][G.step];

// ===== 操作：点选或拖动；爽玩模式点一下自动找最好的地方倒 =====
function pickable(i){const t=G.s.t[i];return t.length>0&&!isDone(t,CAP)&&!TUBES[i].busy&&!iceLeft(G.s,i);}
function allows(i,j){if(!G.script||G.step>=G.script.length)return true;const [a,b]=G.script[G.step];return i===a&&(j===undefined||j===b);}
function nope(i,why){if(i>=0){TUBES[i].shakeT=now();kick(400);}sfx.nope();if(why&&G.L<=4)toast(why,1400);}
function whyNot(i,j){const a=G.s.t[i],b=G.s.t[j];if(iceLeft(G.s,j))return'冰冻瓶还没化开';if(b.length>=capOf(G.s,j))return'这个瓶子满了';if(b.length&&topOf(b)!==topOf(a))return'颜色不一样，倒不进去';return'';}
// 爽玩：挑一个最好的目标瓶。凑满一瓶 > 倒进同色单色瓶 > 整段倒到同色上 > 倒进空瓶 > 只倒进一部分（会把一段拆开）；
// 倒完回到走过的局面排最后，免得两个瓶子来回倒；倒完还能解的优先
function casualTarget(i){
  const s=G.s,a=s.t[i];if(!a.length||isDone(a,CAP))return-1;
  const run=runOf(a),mono=isMono(a),c=[],seen=new Set(G.hist.map(h=>keyOf(h.s)));
  for(let j=0;j<s.t.length;j++){
    if(!canPour(s,i,j)||TUBES[j].busy)continue;const b=s.t[j];let sc;
    if(!b.length){if(mono)continue;sc=400-j*.01;}
    else{const amt=pourAmt(s,i,j),bm=isMono(b);
      if(bm)sc=b.length+amt===CAP?2000:1000+b.length*5;
      else if(mono)sc=amt===run?150:20;
      else sc=amt===run?600+b.length*5:50;}
    if(seen.has(keyOf(applyPour(s,i,j))))sc-=5000;
    c.push({j,sc});
  }
  c.sort((x,y)=>y.sc-x.sc);
  for(const o of c.slice(0,4))if(solvable(applyPour(s,i,o.j),2500))return o.j;
  return c.length?c[0].j:-1;
}
// 点的是没法倒出去的瓶子：找一个能倒进它的
function casualSource(j){
  const s=G.s,b=s.t[j];if(!b.length||b.length>=capOf(s,j))return-1;let best=-1,bs=-1e9;const seen=new Set(G.hist.map(h=>keyOf(h.s)));
  for(let k=0;k<s.t.length;k++){if(!canPour(s,k,j)||TUBES[k].busy)continue;const amt=pourAmt(s,k,j);
    const sc=(b.length+amt===CAP&&isMono(b)?1000:0)+(amt===runOf(s.t[k])?100:0)+amt-(seen.has(keyOf(applyPour(s,k,j)))?5000:0);if(sc>bs){bs=sc;best=k;}}
  return best;
}
function tap(i){
  if(i<0){if(G.sel>=0){G.sel=-1;sfx.put();updateGuide();}return;}
  if(iceLeft(G.s,i)&&(G.sel<0||casual())){nope(i);toast(`再凑满 ${iceLeft(G.s,i)} 瓶，冰就化了`,1600);return;}
  if(casual()){
    if(G.script&&G.step<G.script.length){if(!allows(i)){nope(i);return;}startPour(i,G.script[G.step][1]);return;}
    if(TUBES[i].busy)return;
    const j=casualTarget(i);if(j>=0){startPour(i,j);return;}
    const k=casualSource(i);if(k>=0){startPour(k,i);return;}
    nope(i,G.s.t[i].length?'没有地方能倒':'');return;
  }
  if(G.sel<0){if(pickable(i)&&allows(i)){G.sel=i;sfx.pick();wobble(i);}else nope(i);updateGuide();return;}
  if(G.sel===i){G.sel=-1;sfx.put();updateGuide();return;}
  if(canPour(G.s,G.sel,i)&&!TUBES[i].busy&&allows(G.sel,i)){startPour(G.sel,i);return;}
  if(pickable(i)&&!G.script){G.sel=i;sfx.pick();wobble(i);return;}

}
function tubeAt(x,y){

}
// ===== 吧台订单：每凑满一种颜色，就做好一杯这个口味端走；订单只是展示，不限制先做哪种 =====
const ORD={all:[],slots:[],queue:[],pend:[],gen:0};let cupId=0;
const CUP_BODY='M8 20h30l-3.2 39a3 3 0 0 1-3 2.8H14.2a3 3 0 0 1-3-2.8z';
const cupSvg=c=>{const id='oc'+(cupId++);return`<span class="bub">${FLAV[c]}</span><svg viewBox="0 0 46 62" aria-hidden="true"><defs><clipPath id="${id}"><path d="${CUP_BODY}"/></clipPath></defs>
  <ellipse cx="23" cy="61.5" rx="15" ry="2.6" fill="rgba(110,60,25,.22)"/><rect class="fill" clip-path="url(#${id})" x="6" y="24" width="34" height="38" fill="${PAL[c]}"/>
  <path d="M28 3 21 57" stroke="#f58aa6" stroke-width="4.5" stroke-linecap="round"/>
  <path d="${CUP_BODY}" fill="rgba(255,255,255,.38)" stroke="rgba(146,164,188,.95)" stroke-width="1.8"/><path d="M12.5 26l2 29" stroke="rgba(255,255,255,.85)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M5.5 20.5c2-6.5 33-6.5 35 0z" fill="#ffd6e0" stroke="#f3a3b8" stroke-width="1.5"/><rect x="4" y="19" width="38" height="3.4" rx="1.7" fill="#fff" stroke="rgba(146,164,188,.95)" stroke-width="1.2"/></svg>`;};
const slotEl=k=>$('orders').children[k];
function setSlot(k,c,pop){
  const el=slotEl(k);ORD.slots[k]=c==null?null:{c,filled:false};
  if(c==null){el.hidden=true;return;}
  el.hidden=false;el.className='ord'+(pop?' pre':'');el.innerHTML=cupSvg(c);
  if(pop){void el.offsetWidth;el.classList.remove('pre');}
}
function initOrders(){
  ORD.all=[...new Set(G.s.t.flatMap(t=>[...t].reverse()))];
  $('orders').innerHTML='<div class="ord"></div>'.repeat(Math.min(3,ORD.all.length));syncOrders();
}
// 按当前局面重排（开局、撤销、退回时），不放动画
function syncOrders(){
  ORD.gen++;const done=new Set(G.s.t.filter(t=>isDone(t,CAP)).map(t=>t[0]));
  ORD.queue=ORD.all.filter(c=>!done.has(c));ORD.pend=[];
  for(let k=0;k<$('orders').children.length;k++)setSlot(k,ORD.queue.length?ORD.queue.shift():null,false);
}
function serveOrder(c){
  let k=ORD.slots.findIndex(s=>s&&s.c===c&&!s.filled);
  if(k<0){
    k=ORD.slots.findIndex(s=>s&&!s.filled);
    if(k<0){ORD.pend.push(c);return;}
    // 做好的口味不在吧台上：顶替一张还没做的单，被顶掉的放回队首
    ORD.queue=ORD.queue.filter(x=>x!==c);ORD.queue.unshift(ORD.slots[k].c);setSlot(k,c,false);
    const b=slotEl(k).firstChild;b.classList.add('swap');setTimeout(()=>b.classList.remove('swap'),220);
  }
  const el=slotEl(k),gen=ORD.gen;ORD.slots[k].filled=true;
  setTimeout(()=>{if(gen===ORD.gen)el.classList.add('full');},30);
  setTimeout(()=>{if(gen!==ORD.gen)return;el.classList.add('out');
    setTimeout(()=>{if(gen!==ORD.gen)return;const p=ORD.pend.shift();
      if(p!=null){ORD.queue=ORD.queue.filter(x=>x!==p);setSlot(k,p,true);serveOrder(p);}
      else setSlot(k,ORD.queue.length?ORD.queue.shift():null,true);},400);},1250);
}
let toastH=0;
function toast(s,ms=2000){const t=$('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(toastH);toastH=setTimeout(()=>t.classList.add('hide'),ms);}

// ===== 按钮 =====
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{ac();
  const k=b.dataset.tool;if(k==='undo')useUndo();else if(k==='hint')useHint();else if(k==='tube')useTube();else restart();}));
$('homeBtn').onclick=showHome;
$('playBtn').onclick=()=>{ac();startLevel(prog().unlocked);};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{G.mode=SAVE.mode=b.dataset.mode;writeSave();showHome();});
$('optSound').onchange=e=>{SAVE.muted=!e.target.checked;SFX.on=!SAVE.muted;writeSave();};
$('optSym').onchange=e=>{SAVE.sym=G.sym=e.target.checked;writeSave();kick(100);};
$('rsBack').onclick=()=>{if(!G.rescue)return;const n=G.rescue.n;useUndo(n);};
$('rsTube').onclick=useTube;
$('rsClose').onclick=hideRescue;
$('winNext').onclick=()=>startLevel(G.L+1);
$('winAgain').onclick=()=>startLevel(G.L,true,G.daily);
$('dailyBtn').onclick=()=>{ac();startLevel(0,false,today());};
$('winHome').onclick=showHome;
$('collBtn').onclick=()=>{ac();showColl();};
$('collClose').onclick=()=>{$('coll').hidden=true;showHome();};
$('winShare').onclick=()=>{ac();openShare();};
$('shareClose').onclick=()=>{$('share').hidden=true;};
addEventListener('resize',()=>{if(TUBES.length)layout(false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)timerPause();else if(G.active&&G.moves&&!G.won)timerStart();});

loadSave();G.mode=SAVE.mode;SFX.on=!SAVE.muted;G.sym=!!SAVE.sym;applySkin();
$('hand').innerHTML=HAND_SVG;
// 首页背后先摆一关当背景
startLevel(Math.min(prog().unlocked,60),true);showHome();
window.__dd={G,GEO,pourAngle,levelC,get TUBES(){return TUBES;},startLevel,tap,useUndo,useHint,useTube,restore,showHome};
})();
</script>
